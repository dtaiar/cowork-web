<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CoWork · Sign in</title>
  <style>
    :root {
      --bg:  #090909;
      --s1:  #131313;
      --s2:  #1b1b1b;
      --b1:  rgba(255,255,255,0.08);
      --b2:  rgba(255,255,255,0.13);
      --t1:  #efefef;
      --t2:  #888;
      --t3:  #444;
      --ga:  linear-gradient(135deg,#4A8EF7 0%,#9B7DF7 100%);
      --a1:  #4A8EF7;
      --red: #E05555;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--t1);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--safe-t) + 24px) 24px calc(var(--safe-b) + 24px);
    }

    .card {
      width: 100%;
      max-width: 360px;
    }

    .wordmark {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1;
      background: var(--ga);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 14px;
      color: var(--t3);
      margin-bottom: 40px;
      letter-spacing: -0.1px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--t3);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      background: var(--s1);
      border: 1px solid var(--b1);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 15px;
      color: var(--t1);
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 16px;
      -webkit-appearance: none;
    }

    input:focus { border-color: var(--b2); }
    input::placeholder { color: var(--t3); }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      background: var(--ga);
      color: #fff;
      letter-spacing: -0.2px;
      transition: opacity 0.15s;
      margin-top: 4px;
    }

    .btn:active { opacity: 0.85; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .err {
      font-size: 13px;
      color: var(--red);
      margin-top: 14px;
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="wordmark">CoWork</div>
    <div class="tagline">Personal design OS</div>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">

    <button class="btn" id="signInBtn">Sign in</button>
    <div class="err" id="errMsg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    // If already signed in, go straight to the hub
    getUser().then(u => { if (u) window.location.href = 'index.html' })

    const btn   = document.getElementById('signInBtn')
    const err   = document.getElementById('errMsg')
    const email = document.getElementById('email')
    const pass  = document.getElementById('password')

    async function doSignIn() {
      err.textContent = ''
      btn.disabled = true
      btn.textContent = 'Signing in…'

      const { error } = await signIn(email.value.trim(), pass.value)

      if (error) {
        err.textContent = error.message
        btn.disabled = false
        btn.textContent = 'Sign in'
      } else {
        window.location.href = 'index.html'
      }
    }

    btn.addEventListener('click', doSignIn)
    pass.addEventListener('keydown', e => { if (e.key === 'Enter') doSignIn() })
  </script>
</body>
</html>
