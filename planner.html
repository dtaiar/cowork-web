<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <title>Planner · CoWork</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='2' width='24' height='28' rx='4' fill='%23faf9f5' stroke='%23D97757' stroke-width='2'/%3E%3Crect x='8' y='0' width='16' height='5' rx='2.5' fill='%23D97757'/%3E%3Cpath d='M9 13l3 3 5-5' fill='none' stroke='%23D97757' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='20' y='12' width='5' height='2' rx='1' fill='%23c4c4c2'/%3E%3Crect x='9' y='20' width='10' height='2' rx='1' fill='%23c4c4c2'/%3E%3Crect x='9' y='25' width='7' height='2' rx='1' fill='%23c4c4c2'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:  #090909; --s1:  #141414; --s2:  #1e1e1e; --s3:  #252525;
      --t1:  #efefef; --t2:  #aaaaaa; --t3:  #666666;
      --b0:  rgba(255,255,255,0.06); --b1:  rgba(255,255,255,0.09); --b2:  rgba(255,255,255,0.13);
      --accent: #D97757; --accent-hover: #e88a65;
      --ga: linear-gradient(135deg,#4A8EF7 0%,#9B7DF7 100%);
      --a1: #4A8EF7; --a2: #9B7DF7;
      --green: #3DC87A; --amber: #F0A928; --red: #E05555; --blue: #4A8EF7; --violet: #9B7DF7;
      --shadow: rgba(0,0,0,0.35); --shadow-hover: rgba(0,0,0,0.55);
      --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--bg); color: var(--t1);
      height: 100vh; padding: 20px 24px;
      line-height: 1.5; overflow: hidden;
      display: flex; flex-direction: column;
    }

    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; padding-bottom: 16px;
      border-bottom: 1px solid var(--b1); flex-shrink: 0;
    }

    h1 {
      font-size: 1.5rem; font-weight: 700; letter-spacing: -0.04em;
      background: var(--ga); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text;
    }

    .header-left { display: flex; align-items: center; gap: 0; }

    .view-toggle {
      display: flex; gap: 4px; background: var(--s1);
      padding: 4px; border-radius: 8px; margin-left: 16px;
    }
    .view-toggle button {
      background: transparent; border: none; padding: 6px 14px;
      font-size: 13px; color: var(--t3); border-radius: 6px; cursor: pointer;
      font-family: inherit;
    }
    .view-toggle button:hover { color: var(--t1); }
    .view-toggle button.active { background: var(--s2); color: var(--t1); box-shadow: 0 1px 3px var(--shadow); }

    button {
      background: var(--s2); color: var(--t1); border: 1px solid var(--b1);
      padding: 10px 18px; border-radius: 8px; cursor: pointer;
      font-size: 14px; font-weight: 500; font-family: inherit; transition: all 0.15s ease;
    }
    button:hover { background: var(--s1); border-color: var(--t3); }
    button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ===== BOARD ===== */
    .board {
      display: flex; gap: 24px;
      overflow-x: auto; overflow-y: hidden;
      padding-bottom: 24px; flex: 1; min-height: 0;
    }
    .column {
      background: var(--s1); border-radius: 12px;
      min-width: 340px; max-width: 340px;
      display: flex; flex-direction: column;
      height: 100%; max-height: 100%;
    }
    .column-header {
      padding: 16px 18px; font-weight: 600; font-size: 13px;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--t2);
      display: flex; justify-content: space-between; align-items: center; cursor: grab;
    }
    .column-header:active { cursor: grabbing; }
    .column.dragging-column { opacity: 0.5; }
    .column-drop-indicator {
      width: 3px; background: var(--accent); border-radius: 2px;
      margin: 0 -2px; min-height: 100px;
    }
    .column-header .count {
      background: var(--s2); padding: 3px 10px; border-radius: 12px;
      font-size: 12px; font-weight: 500; color: var(--t3);
    }
    .cards { flex: 1; overflow-y: auto; padding: 0 12px 12px; min-height: 100px; }
    .cards.drag-over { background: rgba(255,255,255,0.03); border-radius: 8px; }

    .task-card {
      background: var(--s2); border: 1px solid var(--b0); border-radius: 10px;
      padding: 14px 16px; margin-bottom: 10px; cursor: grab;
      transition: all 0.15s ease; box-shadow: 0 1px 3px var(--shadow); position: relative;
    }
    .task-card:hover { box-shadow: 0 4px 12px var(--shadow-hover); border-color: var(--b1); }
    .task-card .add-on-hover { display: none; }
    .task-card:hover .add-on-hover { display: block; }
    .task-card .delete-btn {
      display: none; position: absolute; top: 8px; right: 8px;
      background: transparent; border: none; color: var(--t3); cursor: pointer;
      padding: 4px 6px; font-size: 14px; line-height: 1; border-radius: 4px;
    }
    .task-card:hover .delete-btn { display: block; }
    .task-card .delete-btn:hover { background: var(--s1); color: var(--accent); }
    .task-card.dragging { opacity: 0.5; transform: rotate(2deg); }

    .card-title { font-size: 14px; font-weight: 500; line-height: 1.5; color: var(--t1); }
    .card-note {
      font-size: 13px; color: var(--t3); margin-top: 6px;
      line-height: 1.4; overflow-wrap: break-word; word-break: break-word; white-space: pre-wrap;
    }
    .task-card .card-note:not(.add-on-hover) {
      border-left: 2px solid rgba(155,125,247,.25); padding-left: 8px;
    }
    .card-subtasks {
      margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--b0);
      font-size: 13px; color: var(--t2);
    }
    .subtask { padding: 3px 0; display: flex; align-items: flex-start; gap: 8px; }

    .checkbox {
      width: 18px; height: 18px; min-width: 18px; min-height: 18px; flex-shrink: 0;
      border: 2px solid var(--b1); border-radius: 5px;
      display: inline-flex; align-items: center; justify-content: center;
      vertical-align: middle; cursor: pointer; transition: all 0.15s ease; background: var(--s2);
    }
    .checkbox:hover { border-color: var(--accent); }
    .checkbox.checked { background: var(--accent); border-color: var(--accent); }
    .checkbox.checked::after {
      content: ''; width: 5px; height: 9px; border: solid white;
      border-width: 0 2px 2px 0; transform: rotate(45deg); margin-bottom: 2px;
    }

    .empty-state { text-align: center; padding: 80px 40px; color: var(--t3); }
    .empty-state button { font-size: 16px; padding: 14px 28px; background: var(--accent); border: none; color: white; }
    .empty-state button:hover { background: var(--accent-hover); }

    .status-bar {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--t1); color: var(--bg); padding: 12px 24px; border-radius: 10px;
      font-size: 13px; font-weight: 500; opacity: 0; transition: opacity 0.2s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 200;
    }
    .status-bar.visible { opacity: 1; }

    .add-card { padding: 12px; }
    .add-card button {
      width: 100%; background: transparent;
      border: 2px dashed var(--b1); color: var(--t3); font-weight: 500;
    }
    .add-card button:hover { border-color: var(--accent); color: var(--accent); background: transparent; }

    .new-task-input {
      width: 100%; background: var(--s2); border: 2px solid var(--accent);
      border-radius: 8px; padding: 12px; color: var(--t1); font-size: 14px;
      font-family: inherit; resize: none;
    }
    .new-task-input:focus { outline: none; }
    .new-task-input::placeholder { color: var(--t3); }

    /* Scrollbars */
    .cards::-webkit-scrollbar, .list-view::-webkit-scrollbar { width: 6px; }
    .cards::-webkit-scrollbar-track, .list-view::-webkit-scrollbar-track { background: transparent; }
    .cards::-webkit-scrollbar-thumb, .list-view::-webkit-scrollbar-thumb { background: var(--b1); border-radius: 3px; }
    .cards::-webkit-scrollbar-thumb:hover, .list-view::-webkit-scrollbar-thumb:hover { background: var(--t3); }

    /* ===== LIST VIEW ===== */
    .list-view { max-width: 800px; margin: 0 auto; flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; }
    .list-section { margin-bottom: 28px; }
    .list-section.drag-over { background: rgba(255,255,255,0.03); border-radius: 8px; margin: 0 -12px 32px; padding: 0 12px; }
    .list-section-header {
      font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--t2); padding: 4px 0; margin-bottom: 6px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .list-section-header .section-title { cursor: pointer; }
    .list-section-header .section-title:hover { color: var(--t1); }
    .list-section-header .count { font-size: 12px; color: var(--t3); font-weight: 500; }

    .list-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 14px; margin-bottom: 6px; background: var(--s2);
      border: 1px solid var(--b0); cursor: grab; position: relative;
      border-radius: 10px; transition: all 0.15s ease; box-shadow: 0 1px 3px var(--shadow);
    }
    .list-item:active { cursor: grabbing; }
    .list-item:hover { box-shadow: 0 4px 12px var(--shadow-hover); border-color: var(--b1); }
    .list-item.dragging { opacity: 0.5; background: var(--s1); }
    .list-item .checkbox { margin-top: 2px; flex-shrink: 0; }
    .list-item-content { flex: 1; min-width: 0; }
    .list-item-title { font-size: 15px; color: var(--t1); line-height: 1.4; }
    .list-item-title.checked { color: var(--t3); text-decoration: line-through; }
    .list-item-note {
      font-size: 13px; color: var(--t3); margin-top: 4px;
      cursor: pointer; line-height: 1.5; white-space: pre-wrap; overflow-wrap: break-word;
    }
    .list-item-note:not(.add-note) { border-left: 2px solid rgba(155,125,247,.25); padding-left: 8px; margin-top: 6px; }
    .list-item-note:hover { color: var(--t2); }
    .list-item-note.add-note { font-style: italic; display: none; }
    .list-item:hover .list-item-note.add-note { display: block; }
    .list-item-subtasks { margin-top: 8px; padding-left: 2px; }
    .list-item-subtask { display: flex; align-items: flex-start; gap: 8px; padding: 3px 0; font-size: 13px; color: var(--t2); }
    .list-item-subtask .checkbox { width: 16px; height: 16px; min-width: 16px; min-height: 16px; margin-top: 1px; }
    .list-item-subtask span { cursor: pointer; }
    .list-item-subtask span:hover { color: var(--t1); }
    .list-item-add-subtask { font-size: 13px; color: var(--t3); font-style: italic; cursor: pointer; padding: 3px 0 3px 24px; display: none; }
    .list-item:hover .list-item-add-subtask { display: block; }
    .list-item-add-subtask:hover { color: var(--accent); }
    .list-item-actions { display: none; position: absolute; top: 8px; right: 8px; }
    .list-item:hover .list-item-actions { display: flex; gap: 4px; }
    .list-item-actions button { background: transparent; border: none; color: var(--t3); cursor: pointer; padding: 4px 6px; font-size: 14px; line-height: 1; border-radius: 4px; }
    .list-item-actions button:hover { background: var(--s2); color: var(--accent); }
    .list-drop-indicator { height: 3px; background: var(--accent); border-radius: 2px; margin: 2px -12px; }
    .list-add-section {
      margin-top: 16px; padding: 16px; border: 2px dashed var(--b1);
      border-radius: 8px; text-align: center; cursor: pointer;
      color: var(--t3); font-size: 14px; font-weight: 500; transition: all 0.15s ease;
    }
    .list-add-section:hover { border-color: var(--accent); color: var(--accent); }
    .quick-add { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
    .quick-add-input { flex: 1; background: transparent; border: none; font-size: 15px; color: var(--t1); font-family: inherit; outline: none; }
    .quick-add-input::placeholder { color: var(--t3); }
    .quick-add-section {
      font-size: 12px; color: var(--t3); background: var(--s1);
      padding: 4px 10px; border-radius: 6px; cursor: pointer; border: 1px solid var(--b1);
    }
    .quick-add-section:hover { border-color: var(--accent); }
    .section-picker {
      position: absolute; background: var(--s2); border: 1px solid var(--b1);
      border-radius: 8px; box-shadow: 0 4px 20px var(--shadow-hover); padding: 4px; z-index: 100;
    }
    .section-picker button { display: block; width: 100%; text-align: left; padding: 8px 12px; font-size: 13px; background: transparent; border: none; border-radius: 6px; }
    .section-picker button:hover { background: var(--s1); }

    .back-btn-dash {
      width: 32px; height: 32px; background: var(--s2); border: 1px solid var(--b1); border-radius: 10px;
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none; color: var(--t3); margin-right: 10px; flex-shrink: 0; transition: all 0.15s;
    }
    .back-btn-dash:hover { border-color: rgba(255,255,255,0.2); color: var(--t1); }
    .back-btn-dash svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>
  <header>
    <div class="header-left">
      <a class="back-btn-dash" href="index.html">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <h1>Planner</h1>
      <div class="view-toggle" id="taskViewToggle">
        <button id="boardViewBtn" class="active">Board</button>
        <button id="listViewBtn">List</button>
      </div>
    </div>
  </header>

  <div style="display:flex; flex:1; min-height:0; flex-direction:column;">
    <div class="list-view" id="listView" style="display: none;"></div>
    <div class="board" id="board">
      <div class="empty-state" id="boardEmptyState" style="width: 100%;">
        <p style="margin-bottom: 24px; font-size: 18px; font-weight: 600; color: var(--t1);" id="boardEmptyMsg">Loading tasks…</p>
      </div>
    </div>
  </div>

  <div class="status-bar" id="status"></div>

  <script>
    const statusEl = document.getElementById('status');
    function showStatus(msg) {
      statusEl.textContent = msg;
      statusEl.classList.add('visible');
      setTimeout(() => statusEl.classList.remove('visible'), 2000);
    }

    // ===== TASKS STATE =====
    let sections = [];
    let tasks = {};
    let _dbTaskIds = new Set();
    let hasChanges = false;
    let currentView = 'board';
    let quickAddSection = null;
    let _removedIds = [];

    const board = document.getElementById('board');
    const listView = document.getElementById('listView');
    const listViewBtn = document.getElementById('listViewBtn');
    const boardViewBtn = document.getElementById('boardViewBtn');

    function taskSectionId(name) {
      return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    function createCard(task) {
      const card = document.createElement('div');
      card.className = 'task-card';
      card.draggable = true;
      card.dataset.id = task.id;

      const projectLabel = task.project
        ? `<span style="font-size:11px;font-weight:500;padding:2px 7px;border-radius:4px;background:rgba(74,142,247,.12);color:#4A8EF7;margin-left:4px;">${task.project === 'hedging-tool' ? 'HT' : task.project === 'customer-portal' ? 'Portal' : task.project}</span>`
        : '';
      const agentNote = task.note && task.note.length > 50
        ? `<span style="font-size:10px;color:#9B7DF7;margin-left:4px;" title="Agent-enriched">✦</span>`
        : '';

      let html = `
        <div style="display: flex; align-items: flex-start; gap: 12px;">
          <button class="delete-btn" data-action="delete" title="Delete task">&times;</button>
          <span class="checkbox ${task.checked ? 'checked' : ''}" data-action="toggle"></span>
          <div style="flex:1;min-width:0;">
            <div class="card-title" data-action="edit-title">${task.title}</div>
            <div style="display:flex;align-items:center;gap:2px;margin-top:3px;">${projectLabel}${agentNote}</div>
          </div>
        </div>`;

      if (task.note) {
        html += `<div class="card-note" data-action="edit-note" style="cursor:pointer;margin-left:30px;">${task.note}</div>`;
      } else {
        html += `<div class="card-note add-on-hover" data-action="edit-note" style="cursor:pointer;margin-left:30px;font-style:italic;">+ Add note</div>`;
      }

      if (task.subtasks.length > 0) {
        html += '<div class="card-subtasks" style="margin-left:30px;">';
        task.subtasks.forEach((st, idx) => {
          html += `<div class="subtask"><span class="checkbox ${st.checked ? 'checked' : ''}" data-action="toggle-sub" data-idx="${idx}" style="width:16px;height:16px;min-width:16px;min-height:16px;"></span><span data-action="edit-subtask" data-idx="${idx}" style="cursor:pointer;">${st.text}</span></div>`;
        });
        html += `<div class="subtask add-on-hover" data-action="add-subtask" style="color:var(--t3);cursor:pointer;font-style:italic;padding-left:24px;">+ Add subtask</div></div>`;
      } else {
        html += `<div class="card-subtasks add-on-hover" style="margin-left:30px;"><div class="subtask" data-action="add-subtask" style="color:var(--t3);cursor:pointer;font-style:italic;">+ Add subtask</div></div>`;
      }

      card.innerHTML = html;

      card.addEventListener('dragstart', (e) => { card.classList.add('dragging'); e.dataTransfer.setData('text/plain', task.id); });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      card.addEventListener('click', (e) => {
        const action = e.target.dataset.action;
        if (action === 'toggle') { task.checked = !task.checked; markChanged(); renderTasks(); }
        else if (action === 'toggle-sub') { const idx = parseInt(e.target.dataset.idx); task.subtasks[idx].checked = !task.subtasks[idx].checked; markChanged(); renderTasks(); }
        else if (action === 'edit-title') { startEditingTitle(e.target, task); }
        else if (action === 'edit-note') { startEditingNote(e.target, task); }
        else if (action === 'edit-subtask') { startEditingSubtask(e.target, task, parseInt(e.target.dataset.idx)); }
        else if (action === 'add-subtask') { startAddingSubtask(e.target, task); }
        else if (action === 'delete') { deleteTask(task); }
      });
      return card;
    }

    function startEditingTitle(titleEl, task) {
      const input = document.createElement('input');
      input.type = 'text'; input.value = task.title;
      input.style.cssText = 'width:100%;background:var(--s2);border:2px solid var(--accent);border-radius:6px;padding:6px 10px;color:var(--t1);font-size:14px;font-family:inherit;outline:none;';
      titleEl.replaceWith(input); input.focus(); input.select();
      let saved = false;
      const saveEdit = () => { if (saved) return; saved = true; const v = input.value.trim(); if (v && v !== task.title) { task.title = v; markChanged(); } renderTasks(); };
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveEdit(); } else if (e.key === 'Escape') { saved = true; renderTasks(); } });
      input.addEventListener('blur', saveEdit);
    }

    function startEditingNote(noteEl, task) {
      const input = document.createElement('input');
      input.type = 'text'; input.value = task.note || ''; input.placeholder = 'Add a note...';
      input.style.cssText = 'width:100%;background:var(--s2);border:2px solid var(--accent);border-radius:6px;padding:4px 8px;color:var(--t1);font-size:13px;font-family:inherit;outline:none;';
      noteEl.replaceWith(input); input.focus();
      let saved = false;
      const saveEdit = () => { if (saved) return; saved = true; task.note = input.value.trim(); markChanged(); renderTasks(); };
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveEdit(); } else if (e.key === 'Escape') { saved = true; renderTasks(); } });
      input.addEventListener('blur', saveEdit);
    }

    function startEditingSubtask(subtaskEl, task, idx) {
      const input = document.createElement('input');
      input.type = 'text'; input.value = task.subtasks[idx].text;
      input.style.cssText = 'width:calc(100% - 30px);background:var(--s2);border:2px solid var(--accent);border-radius:4px;padding:2px 6px;color:var(--t1);font-size:13px;font-family:inherit;outline:none;';
      subtaskEl.replaceWith(input); input.focus(); input.select();
      let saved = false;
      const saveEdit = () => { if (saved) return; saved = true; const v = input.value.trim(); if (v) task.subtasks[idx].text = v; else task.subtasks.splice(idx, 1); markChanged(); renderTasks(); };
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveEdit(); } else if (e.key === 'Escape') { saved = true; renderTasks(); } });
      input.addEventListener('blur', saveEdit);
    }

    function startAddingSubtask(el, task) {
      const input = document.createElement('input');
      input.type = 'text'; input.placeholder = 'New subtask...';
      input.style.cssText = 'width:calc(100% - 10px);background:var(--s2);border:2px solid var(--accent);border-radius:4px;padding:2px 6px;color:var(--t1);font-size:13px;font-family:inherit;outline:none;';
      el.replaceWith(input); input.focus();
      let saved = false;
      const saveEdit = () => { if (saved) return; saved = true; const v = input.value.trim(); if (v) { task.subtasks.push({ text: v, checked: false }); markChanged(); } renderTasks(); };
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveEdit(); } else if (e.key === 'Escape') { saved = true; renderTasks(); } });
      input.addEventListener('blur', saveEdit);

      col.addEventListener('dragover', (e) => {

          board.querySelectorAll('.column-drop-indicator').forEach(el => el.remove());
          const indicator = document.createElement('div'); indicator.className = 'column-drop-indicator';
          const rect = col.getBoundingClientRect();
          if (e.clientX < rect.left + rect.width / 2) col.before(indicator); else col.after(indicator);
        }
      });
      col.addEventListener('drop', (e) => {
        if (e.dataTransfer.types.includes('text/column')) {
          e.preventDefault(); e.stopPropagation();
          const fromId = e.dataTransfer.getData('text/column');
          if (fromId !== id) { const rect = col.getBoundingClientRect(); moveSection(fromId, id, e.clientX < rect.left + rect.width / 2); }

        }
      });

      const cardsContainer = col.querySelector('.cards');

        const allCards = [...cardsContainer.querySelectorAll('.task-card')];

        let insertBeforeCard = null; let dropIndex = visibleCards.length;
        for (let i = 0; i < visibleCards.length; i++) {
          const rect = visibleCards[i].getBoundingClientRect();
          if (e.clientY < rect.top + rect.height / 2) { insertBeforeCard = visibleCards[i]; dropIndex = i; break; }
        }
        return { insertBeforeCard, dropIndex };
      };

      col.addEventListener('dragover', (e) => {
        e.preventDefault(); cardsContainer.classList.add('drag-over');
        col.querySelectorAll('.drop-indicator').forEach(el => el.remove());

      col.addEventListener('drop', (e) => {
        e.preventDefault(); cardsContainer.classList.remove('drag-over');
        col.querySelectorAll('.drop-indicator').forEach(el => el.remove());

    function addNewTask(sectionId, container) {

        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault(); const title = input.value.trim();
          if (title) { if (!tasks[sectionId]) tasks[sectionId] = []; tasks[sectionId].push({ id: Date.now() + Math.random(), title, note: '', checked: false, subtasks: [], section: sectionId }); markChanged(); renderTasks(); } else input.remove();
        } else if (e.key === 'Escape') input.remove();
      });
      input.addEventListener('blur', () => setTimeout(() => input.remove(), 100));
    }

    function moveSection(fromId, toId, insertBefore) {
      const fromIdx = sections.findIndex(s => s.id === fromId);
      const toIdx = sections.findIndex(s => s.id === toId);
      if (fromIdx === -1 || toIdx === -1) return;
      const [section] = sections.splice(fromIdx, 1);
      let newIdx = sections.findIndex(s => s.id === toId);
      if (!insertBefore) newIdx++;
      sections.splice(newIdx, 0, section);
      markChanged(); renderTasks();
    }

    function moveTask(taskId, toSectionId, dropIndex = -1) {
      let task = null;
      for (const section of sections) {
        const idx = (tasks[section.id] || []).findIndex(t => t.id === taskId);
        if (idx !== -1) { task = tasks[section.id].splice(idx, 1)[0]; break; }
      }
      if (!task) return;
      task.section = toSectionId;
      if (!tasks[toSectionId]) tasks[toSectionId] = [];
      if (dropIndex >= 0 && dropIndex <= tasks[toSectionId].length) tasks[toSectionId].splice(dropIndex, 0, task);
      else tasks[toSectionId].push(task);
      markChanged(); renderTasks();
    }

    function deleteTask(task) {
      if (!confirm(`Delete "${task.title}"?`)) return;
      for (const section of sections) {
        const idx = (tasks[section.id] || []).findIndex(t => t.id === task.id);
        if (idx !== -1) { tasks[section.id].splice(idx, 1); break; }
      }
      if (_dbTaskIds.has(String(task.id))) _removedIds.push(task.id);
      markChanged(); renderTasks();
    }

    let saveTimeout = null; let isSaving = false;

    function markChanged() {
      hasChanges = true;
      if (saveTimeout) clearTimeout(saveTimeout);
      saveTimeout = setTimeout(syncToSupabase, 600);
    }

    async function syncToSupabase() {
      if (isSaving) return; isSaving = true;
      try {
        const allTasks = Object.values(tasks).flat();
        for (const t of allTasks) {
          if (_dbTaskIds.has(String(t.id))) {
            await Tasks.update(t.id, { title: t.title, section: t.section, done: !!t.checked, priority: !!t.priority, project: t.project || null, notes: t.note || null });
          } else {
            const row = await Tasks.add({ title: t.title, section: t.section || 'active', priority: !!t.priority, project: t.project || null, notes: t.note || null });
            if (row) { t.id = row.id; t._dbId = row.id; _dbTaskIds.add(row.id); }
          }
        }
        for (const id of _removedIds) await Tasks.remove(id);
        _removedIds = []; hasChanges = false; showStatus('Synced ✓');
      } catch (e) { showStatus('Sync error'); console.error('syncToSupabase:', e); }
      isSaving = false;
    }

    async function loadTasksFromDB() {
      const el = document.getElementById('boardEmptyMsg');
      if (el) el.textContent = 'Loading tasks…';
      try {
        const rows = await Tasks.list();
        _dbTaskIds = new Set(rows.map(r => r.id));
        const SECTION_ORDER = ['active', 'waiting', 'someday', 'done'];
        const SECTION_NAMES = { active: 'Active', waiting: 'Waiting on', someday: 'Someday', done: 'Done' };
        const usedSections = [...new Set(rows.map(r => r.section || 'active'))];
        const ordered = SECTION_ORDER.filter(s => usedSections.includes(s));
        usedSections.filter(s => !SECTION_ORDER.includes(s)).forEach(s => ordered.push(s));
        ['active', 'waiting', 'someday'].forEach(s => { if (!ordered.includes(s)) ordered.push(s); });
        sections = ordered.map(s => ({ id: s, name: SECTION_NAMES[s] || s }));
        tasks = {}; sections.forEach(s => tasks[s.id] = []);
        rows.forEach(row => {
          const sec = row.section || 'active';
          if (!tasks[sec]) tasks[sec] = [];
          tasks[sec].push({ id: row.id, _dbId: row.id, title: row.title, note: row.notes || '', checked: !!row.done, subtasks: [], section: sec, project: row.project, priority: !!row.priority });
        });
        switchTaskView(currentView);
        if (el) el.textContent = rows.length ? '' : 'No tasks yet — add one in Capture';
      } catch (e) { if (el) el.textContent = 'Failed to load tasks'; console.error('loadTasksFromDB:', e); }
    }

      const input = document.createElement('input'); input.type = 'text'; input.placeholder = 'Section name...';
      input.style.cssText = 'width:220px;background:var(--s2);border:2px solid var(--accent);border-radius:8px;padding:10px 14px;color:var(--t1);font-size:14px;font-family:inherit;outline:none;';
      btn.innerHTML = ''; btn.style.cssText = 'background:var(--s1);border:2px dashed var(--accent);display:flex;align-items:center;justify-content:center;cursor:default;min-height:120px;min-width:340px;border-radius:12px;';
      btn.appendChild(input); input.focus();
      let saved = false;
      const saveSection = () => {
        if (saved) return; saved = true;
        const name = input.value.trim();
        if (name) { const id = taskSectionId(name); if (!tasks[id]) { sections.push({ id, name }); tasks[id] = []; markChanged(); } }
        renderTasks();
      };
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveSection(); } else if (e.key === 'Escape') { saved = true; renderTasks(); } });
      input.addEventListener('blur', saveSection);
    }

    function showSectionPicker(anchorEl) {
      document.querySelectorAll('.section-picker').forEach(el => el.remove());
      const picker = document.createElement('div'); picker.className = 'section-picker';
      const rect = anchorEl.getBoundingClientRect();
      picker.style.top = (rect.bottom + 4) + 'px'; picker.style.right = (window.innerWidth - rect.right) + 'px';
      sections.forEach(section => {
        const btn = document.createElement('button'); btn.textContent = section.name;
        btn.addEventListener('click', () => { quickAddSection = section.id; picker.remove(); renderTasks(); setTimeout(() => document.getElementById('quickAddInput')?.focus(), 10); });
        picker.appendChild(btn);
      });
      document.body.appendChild(picker);
      setTimeout(() => {
        document.addEventListener('click', function closeHandler(e) { if (!picker.contains(e.target)) { picker.remove(); document.removeEventListener('click', closeHandler); } });
      }, 10);
    }

    function switchTaskView(view) {
      currentView = view;
      if (view === 'list') { listView.style.display = 'block'; board.style.display = 'none'; listViewBtn.classList.add('active'); boardViewBtn.classList.remove('active'); }
      else { listView.style.display = 'none'; board.style.display = 'flex'; listViewBtn.classList.remove('active'); boardViewBtn.classList.add('active'); }
      renderTasks();
    }

    listViewBtn.addEventListener('click', () => switchTaskView('list'));
    boardViewBtn.addEventListener('click', () => switchTaskView('board'));
    window.addEventListener('beforeunload', (e) => { if (hasChanges) { e.preventDefault(); e.returnValue = ''; } });

    // ===== INIT =====
    (async function init() {
      await requireAuth();
      await loadTasksFromDB();
      Tasks.subscribe(async () => { await loadTasksFromDB(); renderTasks(); });
    })();
  </script>
</body>
</html>
