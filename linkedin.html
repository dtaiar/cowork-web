<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LinkedIn">
  <title>LinkedIn · CoWork</title>
  <style>
    /* ═══════════════════════════════════════
       TOKENS
    ═══════════════════════════════════════ */
    :root {
      --bg:  #090909;
      --s1:  #131313;
      --s2:  #1b1b1b;
      --s3:  #222;
      --b0:  rgba(255,255,255,0.05);
      --b1:  rgba(255,255,255,0.08);
      --b2:  rgba(255,255,255,0.13);
      --t1:  #efefef;
      --t2:  #888;
      --t3:  #444;

      --ga:  linear-gradient(135deg,#9B7DF7 0%,#C879F0 100%);
      --a1:  #9B7DF7;
      --a2:  #C879F0;

      --green:   #3DC87A; --green-d:   rgba(61,200,122,.13);
      --amber:   #F0A928; --amber-d:   rgba(240,169,40,.13);
      --red:     #E05555; --red-d:     rgba(224,85,85,.13);
      --violet:  #9B7DF7; --violet-d:  rgba(155,125,247,.13);
      --teal:    #3CBFB8; --teal-d:    rgba(60,191,184,.13);

      --r:  14px; --rl: 18px; --rs: 10px;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --nav-h: 62px;
    }

    /* ═══════════════════════════════════════
       RESET
    ═══════════════════════════════════════ */
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--t1);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    body { display: flex; flex-direction: column; max-width: 430px; margin: 0 auto; }

    /* ═══════════════════════════════════════
       HEADER
    ═══════════════════════════════════════ */
    .safe-top { height: var(--safe-t); background: var(--bg); flex-shrink: 0; }
    header {
      flex-shrink: 0;
      padding: 16px 22px 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      width: 32px; height: 32px;
      background: var(--s1); border: 1px solid var(--b1);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; color: var(--t2);
      font-size: 16px; flex-shrink: 0;
      transition: background 0.15s;
    }
    .back-btn:active { background: var(--s2); }
    .back-btn svg { width: 16px; height: 16px; stroke: var(--t2); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .wordmark {
      font-size: 20px; font-weight: 700; letter-spacing: -0.6px;
      background: var(--ga);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .hd-right { text-align: right; }
    .hd-date  { font-size: 13px; font-weight: 500; color: var(--t2); }
    .hd-sub   { font-size: 12px; color: var(--t3); display: flex; align-items: center; gap: 5px; justify-content: flex-end; }

    /* ═══════════════════════════════════════
       SCROLL BODY
    ═══════════════════════════════════════ */
    .scroll-body {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 8px 16px calc(var(--nav-h) + var(--safe-b) + 20px);
      -webkit-overflow-scrolling: touch;
    }
    .scroll-body::-webkit-scrollbar { display: none; }

    /* ═══════════════════════════════════════
       NAV
    ═══════════════════════════════════════ */
    .nav-wrap {
      position: fixed; bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 430px;
      padding: 8px 8px env(safe-area-inset-bottom, 0px);
      z-index: 100;
      background: rgba(14,14,14,0.95);
      backdrop-filter: blur(28px) saturate(1.6);
      -webkit-backdrop-filter: blur(28px) saturate(1.6);
      border-top: 1px solid var(--b2);
    }
    .nav-bar {
      display: flex; align-items: stretch;
      gap: 2px;
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4px; padding: 8px 4px;
      background: none; border: none;
      border-radius: 16px;
      cursor: pointer; transition: background 0.15s;
      position: relative;
    }
    .nav-btn.active { background: var(--s2); }
    .nav-btn:active  { background: var(--s3); }
    .ni { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 8px; transition: background 0.15s; }
    .ni svg { width: 22px; height: 22px; stroke: rgba(255,255,255,0.38); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.15s; }
    .nav-btn.active .ni { background: rgba(74,142,247,0.12); }
    .nav-btn.active .ni svg { stroke: var(--a1); }
    .nl { font-size: 10.5px; font-weight: 500; color: rgba(255,255,255,0.38); letter-spacing: 0.2px; transition: color 0.15s; }
    .nav-btn.active .nl { color: var(--a1); font-weight: 600; }
    .n-badge {
      position: absolute; top: 6px; right: 6px;
      min-width: 16px; height: 16px;
      background: var(--a1); color: #fff;
      font-size: 10px; font-weight: 700;
      border-radius: 8px; padding: 0 4px;
      display: flex; align-items: center; justify-content: center;
    }

    /* ═══════════════════════════════════════
       TAB PANE
    ═══════════════════════════════════════ */
    .tab-pane { animation: fadeUp 0.22s cubic-bezier(0.22,1,0.36,1) both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ═══════════════════════════════════════
       CARD
    ═══════════════════════════════════════ */
    .card {
      background: var(--s1); border: 1px solid var(--b1);
      border-radius: var(--rl); padding: 16px; margin-bottom: 10px;
    }
    .card-urgent {
      border-color: rgba(224,85,85,.28);
      box-shadow: 0 0 0 1px rgba(224,85,85,.08);
    }
    .meta {
      display: flex; align-items: center; flex-wrap: wrap;
      gap: 6px; margin-bottom: 8px;
    }
    .body-t  { font-size: 14px; font-weight: 500; line-height: 1.5; color: var(--t1); }
    .body-sm { font-size: 13px; line-height: 1.5; color: var(--t2); margin-top: 6px; white-space: pre-wrap; }
    .sub-t   { font-size: 12px; color: var(--t2); margin-top: 5px; line-height: 1.4; }
    .info-row {
      display: flex; gap: 12px; margin-top: 8px;
      font-size: 12px; color: var(--t2);
    }
    .ts { font-size: 12px; color: var(--t3); }

    /* ═══════════════════════════════════════
       BADGES
    ═══════════════════════════════════════ */
    .badge {
      font-size: 11px; font-weight: 600; letter-spacing: 0.2px;
      padding: 3px 8px; border-radius: 6px;
      display: inline-flex; align-items: center;
    }
    .b-design    { background: rgba(74,142,247,.15);  color: #4A8EF7; }
    .b-product   { background: rgba(240,169,40,.15);  color: #F0A928; }
    .b-tools     { background: rgba(60,191,184,.15);  color: #3CBFB8; }
    .b-personal  { background: rgba(61,200,122,.15);  color: #3DC87A; }
    .b-casestudy { background: rgba(155,125,247,.15); color: #9B7DF7; }

    .b-idea     { background: rgba(136,136,136,.12); color: var(--t2); }
    .b-drafting { background: rgba(240,169,40,.12);  color: var(--amber); }
    .b-ready    { background: rgba(61,200,122,.12);  color: var(--green); }
    .b-posted   { background: rgba(155,125,247,.12); color: var(--violet); }

    /* ═══════════════════════════════════════
       CHIPS
    ═══════════════════════════════════════ */
    .chip-group { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
    .chip {
      --_c: var(--t3); --_cd: var(--s2);
      padding: 7px 14px; border-radius: 20px;
      border: 1px solid var(--b1);
      background: var(--s2); color: var(--t2);
      font-size: 13px; font-weight: 500;
      cursor: pointer; font-family: inherit;
      transition: all 0.15s;
    }
    .chip:active { transform: scale(0.96); }
    .chip.on { background: var(--_cd); border-color: var(--_c); color: var(--_c); }

    .c-design    { --_c: #4A8EF7; --_cd: rgba(74,142,247,.13); }
    .c-product   { --_c: #F0A928; --_cd: rgba(240,169,40,.13); }
    .c-tools     { --_c: #3CBFB8; --_cd: rgba(60,191,184,.13); }
    .c-personal  { --_c: #3DC87A; --_cd: rgba(61,200,122,.13); }
    .c-casestudy { --_c: #9B7DF7; --_cd: rgba(155,125,247,.13); }

    /* ═══════════════════════════════════════
       FORM
    ═══════════════════════════════════════ */
    .field-label {
      font-size: 11px; font-weight: 600; color: var(--t3);
      text-transform: uppercase; letter-spacing: 0.6px;
      margin-bottom: 8px; margin-top: 16px;
    }
    .field-label:first-child { margin-top: 0; }
    textarea, input[type="text"] {
      width: 100%; background: var(--s2);
      border: 1px solid var(--b1); border-radius: var(--rs);
      color: var(--t1); font-family: inherit; font-size: 14px;
      padding: 12px; outline: none; resize: none;
      transition: border-color 0.15s; line-height: 1.5;
    }
    textarea:focus, input[type="text"]:focus { border-color: rgba(155,125,247,.45); }
    textarea { min-height: 80px; margin-bottom: 6px; }
    input[type="text"] { margin-bottom: 14px; }

    .char-counter {
      font-size: 11px; text-align: right;
      margin-bottom: 14px;
      transition: color 0.2s;
    }
    .char-ok   { color: var(--t3); }
    .char-warn { color: var(--amber); }
    .char-over { color: var(--red); }

    /* ═══════════════════════════════════════
       BUTTONS
    ═══════════════════════════════════════ */
    .btn {
      padding: 11px 18px; border-radius: var(--rs);
      border: none; font-family: inherit;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
      letter-spacing: -0.1px;
    }
    .btn:active  { transform: scale(0.97); opacity: 0.88; }
    .btn:disabled { opacity: 0.3; pointer-events: none; }
    .btn-primary { background: var(--ga); color: #fff; width: 100%; box-shadow: 0 4px 18px rgba(155,125,247,.22); }
    .btn-secondary { background: var(--s2); color: var(--t1); border: 1px solid var(--b1); }
    .btn-danger    { background: var(--red-d); color: var(--red); }
    .btn-success   { background: var(--green-d); color: var(--green); }
    .btn-amber     { background: var(--amber-d); color: var(--amber); }
    .btn-row   { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1; }
    .btn-stack { display: flex; flex-direction: column; gap: 8px; }

    /* ═══════════════════════════════════════
       SECTION
    ═══════════════════════════════════════ */
    .sec {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 4px 2px 8px;
    }
    .sec-label { font-size: 12px; font-weight: 600; color: var(--t3); text-transform: uppercase; letter-spacing: 0.5px; }
    .sec-count { font-size: 12px; color: var(--t3); }

    /* ═══════════════════════════════════════
       FILTER BAR
    ═══════════════════════════════════════ */
    .filter-bar {
      display: flex; gap: 6px; overflow-x: auto;
      margin-bottom: 14px; padding-bottom: 2px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .fp {
      padding: 6px 14px; border-radius: 20px;
      border: 1px solid var(--b1);
      background: var(--s1); color: var(--t2);
      font-size: 13px; font-weight: 500;
      cursor: pointer; font-family: inherit;
      white-space: nowrap; flex-shrink: 0;
      transition: all 0.15s;
    }
    .fp.on { background: var(--violet-d); border-color: var(--a1); color: var(--a1); }

    /* ═══════════════════════════════════════
       POST CARD
    ═══════════════════════════════════════ */
    .post-card {
      background: var(--s1); border: 1px solid var(--b1);
      border-radius: var(--rl); padding: 16px; margin-bottom: 10px;
      transition: border-color 0.15s;
    }
    .post-actions { display: flex; gap: 7px; margin-top: 12px; flex-wrap: wrap; }
    .post-actions .btn { padding: 7px 13px; font-size: 12px; border-radius: 8px; }

    /* Inline editor */
    .editor-wrap {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--b0);
    }
    .draft-preview {
      font-size: 13px; color: var(--t2); line-height: 1.6;
      margin-top: 6px; white-space: pre-wrap;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .draft-full {
      font-size: 13px; color: var(--t1); line-height: 1.7;
      margin-top: 6px; white-space: pre-wrap;
      background: var(--s2); border-radius: var(--rs);
      padding: 12px; border: 1px solid var(--b1);
    }

    /* ═══════════════════════════════════════
       SYNC BLOCK
    ═══════════════════════════════════════ */
    .sync-block {
      background: var(--s1); border: 1px solid var(--b1);
      border-radius: var(--rl); padding: 18px; margin-bottom: 12px;
    }
    .sync-block-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .sync-block-sub   { font-size: 13px; color: var(--t2); line-height: 1.5; margin-bottom: 14px; }
    .code-preview {
      background: var(--s2); border-radius: 8px; padding: 12px;
      font-size: 11px; font-family: "SF Mono", ui-monospace, monospace;
      white-space: pre-wrap; word-break: break-word;
      color: var(--t2); max-height: 140px; overflow-y: auto;
      line-height: 1.5; margin-bottom: 12px;
    }
    #importArea {
      width: 100%; min-height: 80px;
      background: var(--s2); border: 1px solid var(--b1);
      border-radius: var(--rs); color: var(--t1);
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 11px; padding: 12px; resize: none;
      outline: none; line-height: 1.5; margin-bottom: 10px;
    }
    #importArea:focus { border-color: rgba(155,125,247,.45); }
    code {
      background: var(--s2); padding: 2px 6px; border-radius: 4px;
      font-size: 11px; font-family: "SF Mono", ui-monospace, monospace;
      color: var(--t2);
    }

    /* ═══════════════════════════════════════
       MISC
    ═══════════════════════════════════════ */
    .empty { text-align: center; padding: 60px 20px 40px; color: var(--t3); }
    .empty-icon { font-size: 38px; margin-bottom: 12px; opacity: 0.5; }
    .empty-text { font-size: 14px; line-height: 1.6; }
    .hint { font-size: 12px; color: var(--t3); text-align: center; line-height: 1.5; padding: 0 10px; margin-top: 8px; }
    .gdiv { height: 1px; background: linear-gradient(90deg, transparent, var(--b2) 50%, transparent); margin: 4px 0 18px; }

    /* ═══════════════════════════════════════
       TOAST
    ═══════════════════════════════════════ */
    .toast {
      position: fixed;
      bottom: calc(var(--nav-h) + var(--safe-b) + 20px);
      left: 50%; transform: translateX(-50%) translateY(70px);
      background: rgba(240,240,240,0.94); color: #111;
      padding: 10px 22px; border-radius: 22px;
      font-size: 14px; font-weight: 500; z-index: 200;
      transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
      white-space: nowrap; backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>

<div class="safe-top"></div>

<header>
  <div class="header-left">
    <a class="back-btn" href="index.html">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="wordmark">LinkedIn</div>
  </div>
  <div class="hd-right">
    <div class="hd-date" id="hdDate"></div>
    <div class="hd-sub" id="hdSub"></div>
  </div>
</header>

<div class="scroll-body" id="scrollBody">
  <div class="tab-pane" id="tabPane"></div>
</div>

<div class="nav-wrap">
  <div class="nav-bar">
    <button class="nav-btn active" id="nb-ideas" onclick="goto('ideas')">
      <div class="ni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></div>
      <span class="nl">Ideas</span>
      <span class="n-badge" id="ideasBadge" style="display:none"></span>
    </button>
    <button class="nav-btn" id="nb-drafting" onclick="goto('drafting')">
      <div class="ni"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>
      <span class="nl">Drafting</span>
      <span class="n-badge" id="draftingBadge" style="display:none"></span>
    </button>
    <button class="nav-btn" id="nb-ready" onclick="goto('ready')">
      <div class="ni"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <span class="nl">Ready</span>
      <span class="n-badge" id="readyBadge" style="display:none"></span>
    </button>
    <button class="nav-btn" id="nb-posted" onclick="goto('posted')">
      <div class="ni"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
      <span class="nl">Posted</span>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   STATE (loaded from Supabase)
═══════════════════════════════════════════════════════════════ */
let state = { posts: [] };

/* ═══════════════════════════════════════════════════════════════
   APP STATE
═══════════════════════════════════════════════════════════════ */
let tab       = 'ideas';
let topicFilt = 'all';
let editingId = null;
let selTopic  = 'design';

const TOPICS  = { design:'Design', product:'Product', tools:'Tools', personal:'Personal', casestudy:'Case Study' };
const MAX_CHARS = 3000;

/* ═══════════════════════════════════════════════════════════════
   NAV
═══════════════════════════════════════════════════════════════ */
function goto(t) {
  tab = t; editingId = null;
  document.querySelectorAll('.nav-btn').forEach(b =>
    b.classList.toggle('active', b.id === 'nb-' + t)
  );
  render();
  document.getElementById('scrollBody').scrollTop = 0;
}

/* ═══════════════════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════════════════ */
function refreshHeader() {
  const now = new Date();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const days   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  document.getElementById('hdDate').textContent =
    `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;

  const ready = state.posts.filter(p => p.status === 'ready').length;
  document.getElementById('hdSub').textContent = ready > 0 ? `${ready} ready to post` : '';

  const counts = { ideas: 0, drafting: 0, ready: 0 };
  state.posts.forEach(p => {
    if (p.status === 'idea')     counts.ideas++;
    if (p.status === 'drafting') counts.drafting++;
    if (p.status === 'ready')    counts.ready++;
  });
  ['ideas','drafting','ready'].forEach(k => {
    const b = document.getElementById(k + 'Badge');
    if (b) { b.textContent = counts[k]; b.style.display = counts[k] > 0 ? 'flex' : 'none'; }
  });
}

/* ═══════════════════════════════════════════════════════════════
   RENDER ROUTER
═══════════════════════════════════════════════════════════════ */
function render() {
  const pane = document.getElementById('tabPane');
  pane.className = 'tab-pane';
  void pane.offsetWidth;
  pane.className = 'tab-pane';

  if (tab === 'ideas')    pane.innerHTML = renderIdeas();
  if (tab === 'drafting') pane.innerHTML = renderDrafting();
  if (tab === 'ready')    pane.innerHTML = renderReady();
  if (tab === 'posted')   pane.innerHTML = renderPosted();

  refreshHeader();

  if (editingId) {
    const ta = document.getElementById('draftArea_' + editingId);
    if (ta) ta.addEventListener('input', () => updateCharCount(editingId));
  }
}

/* ═══════════════════════════════════════════════════════════════
   IDEAS TAB
═══════════════════════════════════════════════════════════════ */
function renderIdeas() {
  const all      = state.posts.filter(p => p.status === 'idea');
  const filtered = topicFilt === 'all' ? all : all.filter(p => p.topic === topicFilt);

  const form = `
    <div class="card" style="margin-bottom:20px">
      <div class="field-label">Topic</div>
      <div class="chip-group" id="topicChips">
        ${Object.entries(TOPICS).map(([k,v]) =>
          `<button class="chip c-${k} ${selTopic===k?'on':''}" onclick="setTopic('${k}')">${v}</button>`
        ).join('')}
      </div>
      <div class="field-label">Idea</div>
      <input type="text" id="ideaInput" placeholder="What's the post concept?" maxlength="200">
      <button class="btn btn-primary" onclick="addIdea()">Add to backlog</button>
    </div>`;

  const fbar = `<div class="filter-bar">
    ${['all',...Object.keys(TOPICS)].map(f =>
      `<button class="fp ${topicFilt===f?'on':''}" onclick="setTF('${f}')">${f==='all'?'All':TOPICS[f]}</button>`
    ).join('')}
  </div>`;

  if (!all.length && topicFilt === 'all') return form;

  let list = fbar;
  if (!filtered.length) {
    list += `<div class="empty"><div class="empty-icon">💡</div><div class="empty-text">No ideas for this topic</div></div>`;
    return form + list;
  }

  list += `<div class="sec"><span class="sec-label">Backlog</span><span class="sec-count">${filtered.length}</span></div>`;
  filtered.forEach(p => {
    list += `
      <div class="post-card">
        <div class="meta">
          <span class="badge b-${p.topic}">${TOPICS[p.topic] || p.topic}</span>
          <span class="ts">${fmtDate(p.created_at)}</span>
        </div>
        <div class="body-t">${esc(p.hook)}</div>
        <div class="post-actions">
          <button class="btn btn-secondary" onclick="startDraft('${p.id}')">Start draft</button>
          <button class="btn btn-danger" onclick="deletePost('${p.id}')">Delete</button>
        </div>
      </div>`;
  });

  return form + list;
}

/* ═══════════════════════════════════════════════════════════════
   DRAFTING TAB
═══════════════════════════════════════════════════════════════ */
function renderDrafting() {
  const items = state.posts.filter(p => p.status === 'drafting');

  if (!items.length) return `<div class="empty"><div class="empty-icon">✏️</div><div class="empty-text">No posts in drafting.<br>Pick an idea and start writing.</div></div>`;

  let html = `<div class="sec"><span class="sec-label">In progress</span><span class="sec-count">${items.length}</span></div>`;

  items.forEach(p => {
    const isEditing = editingId === p.id;
    const charLen   = (p.content || '').length;
    const charClass = charLen > 2900 ? 'char-over' : charLen > 2500 ? 'char-warn' : 'char-ok';

    html += `
      <div class="post-card">
        <div class="meta">
          <span class="badge b-${p.topic}">${TOPICS[p.topic] || p.topic}</span>
          <span class="badge b-drafting">Drafting</span>
          <span class="ts">${fmtDate(p.created_at)}</span>
        </div>
        <div class="body-t">${esc(p.hook)}</div>
        ${p.content && !isEditing ? `<div class="draft-preview">${esc(p.content)}</div>` : ''}

        ${isEditing ? `
          <div class="editor-wrap">
            <textarea id="draftArea_${p.id}" oninput="updateCharCount('${p.id}')">${esc(p.content)}</textarea>
            <div class="char-counter ${charClass}" id="charCount_${p.id}">${charLen} / ${MAX_CHARS}</div>
            <div class="btn-row">
              <button class="btn btn-success" onclick="saveDraft('${p.id}')">Save</button>
              <button class="btn btn-secondary" onclick="closeEditor()">Cancel</button>
            </div>
          </div>` : ''}

        <div class="post-actions">
          <button class="btn btn-secondary" onclick="${isEditing ? `closeEditor()` : `openEditor('${p.id}')`}">
            ${isEditing ? 'Close' : 'Edit draft'}
          </button>
          <button class="btn btn-amber" onclick="moveStatus('${p.id}','ready')">Mark ready</button>
          <button class="btn btn-danger" onclick="deletePost('${p.id}')">Delete</button>
        </div>
      </div>`;
  });

  return html;
}

/* ═══════════════════════════════════════════════════════════════
   READY TAB
═══════════════════════════════════════════════════════════════ */
function renderReady() {
  const items = state.posts.filter(p => p.status === 'ready');

  if (!items.length) return `<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">Nothing ready yet.<br>Finish a draft and mark it ready.</div></div>`;

  let html = `<div class="sec"><span class="sec-label">Ready to post</span><span class="sec-count">${items.length}</span></div>`;

  items.forEach(p => {
    const charLen   = (p.content || '').length;
    const isExpanded = editingId === p.id;

    html += `
      <div class="post-card" style="border-color: rgba(61,200,122,.2)">
        <div class="meta">
          <span class="badge b-${p.topic}">${TOPICS[p.topic] || p.topic}</span>
          <span class="badge b-ready">Ready</span>
          <span class="ts">${charLen} chars</span>
        </div>
        <div class="body-t">${esc(p.hook)}</div>
        ${isExpanded
          ? `<div class="draft-full">${esc(p.content)}</div>`
          : p.content ? `<div class="draft-preview">${esc(p.content)}</div>` : ''}
        <div class="post-actions">
          <button class="btn btn-success" onclick="copyAndPost('${p.id}')">Copy &amp; post →</button>
          <button class="btn btn-secondary" onclick="${isExpanded ? `closeEditor()` : `openEditor('${p.id}')`}">
            ${isExpanded ? 'Collapse' : 'Read'}
          </button>
          <button class="btn btn-secondary" onclick="moveStatus('${p.id}','drafting')">Back to draft</button>
        </div>
      </div>`;
  });

  return html;
}

/* ═══════════════════════════════════════════════════════════════
   POSTED TAB
═══════════════════════════════════════════════════════════════ */
function renderPosted() {
  const items = state.posts
    .filter(p => p.status === 'posted')
    .sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));

  if (!items.length) return `<div class="empty"><div class="empty-icon">📅</div><div class="empty-text">Nothing posted yet.</div></div>`;

  let html = `<div class="sec"><span class="sec-label">Published</span><span class="sec-count">${items.length}</span></div>`;

  items.forEach(p => {
    const isExpanded = editingId === p.id;
    html += `
      <div class="post-card" style="opacity:0.7">
        <div class="meta">
          <span class="badge b-${p.topic}">${TOPICS[p.topic] || p.topic}</span>
          <span class="badge b-posted">Posted</span>
          <span class="ts">${fmtDate(p.updated_at)}</span>
        </div>
        <div class="body-t">${esc(p.hook)}</div>
        ${isExpanded && p.content ? `<div class="draft-full">${esc(p.content)}</div>` : ''}
        <div class="post-actions">
          ${p.content ? `<button class="btn btn-secondary" onclick="${isExpanded ? `closeEditor()` : `openEditor('${p.id}')`}">${isExpanded ? 'Collapse' : 'Read'}</button>` : ''}
          <button class="btn btn-secondary" onclick="moveStatus('${p.id}','ready')">Repost</button>
          <button class="btn btn-danger" onclick="deletePost('${p.id}')">Delete</button>
        </div>
      </div>`;
  });

  return html;
}

/* ═══════════════════════════════════════════════════════════════
   ACTIONS
═══════════════════════════════════════════════════════════════ */
const setTopic = t => { selTopic = t; render(); };
const setTF    = f => { topicFilt = f; render(); };

async function addIdea() {
  const el = document.getElementById('ideaInput');
  const text = el?.value?.trim();
  if (!text) { toast('Write the idea first'); return; }
  const row = await LI.add({ topic: selTopic, hook: text, content: '', status: 'idea' });
  if (row) state.posts.unshift(row);
  el.value = '';
  toast('Added to backlog ✓');
  render();
}

function startDraft(id) {
  moveStatus(id, 'drafting');
  tab = 'drafting';
  editingId = id;
  document.querySelectorAll('.nav-btn').forEach(b =>
    b.classList.toggle('active', b.id === 'nb-drafting')
  );
  render();
  document.getElementById('scrollBody').scrollTop = 0;
}

const openEditor  = id => { editingId = id; render(); };
const closeEditor = ()  => { editingId = null; render(); };

async function saveDraft(id) {
  const ta = document.getElementById('draftArea_' + id);
  if (!ta) return;
  const text = ta.value;
  if (text.length > MAX_CHARS) { toast(`Over ${MAX_CHARS} chars — trim it`); return; }
  const updated = await LI.update(id, { content: text });
  if (updated) {
    const p = state.posts.find(x => x.id === id);
    if (p) p.content = text;
  }
  toast('Draft saved ✓');
  closeEditor();
}

function updateCharCount(id) {
  const ta = document.getElementById('draftArea_' + id);
  const cc = document.getElementById('charCount_' + id);
  if (!ta || !cc) return;
  const len = ta.value.length;
  cc.textContent = `${len} / ${MAX_CHARS}`;
  cc.className = 'char-counter ' + (len > 2900 ? 'char-over' : len > 2500 ? 'char-warn' : 'char-ok');
}

async function moveStatus(id, newStatus) {
  const updated = await LI.update(id, { status: newStatus });
  const p = state.posts.find(x => x.id === id);
  if (p && updated) {
    p.status = newStatus;
    p.updated_at = updated.updated_at;
  }
  editingId = null;
  render();
}

async function copyAndPost(id) {
  const p = state.posts.find(x => x.id === id);
  if (!p || !p.content) { toast('No draft to copy'); return; }
  try {
    await navigator.clipboard.writeText(p.content);
  } catch {
    const el = document.createElement('textarea');
    el.value = p.content; document.body.appendChild(el); el.select();
    document.execCommand('copy'); document.body.removeChild(el);
  }
  const updated = await LI.update(id, { status: 'posted' });
  if (updated) { p.status = 'posted'; p.updated_at = updated.updated_at; }
  editingId = null;
  tab = 'posted';
  document.querySelectorAll('.nav-btn').forEach(b =>
    b.classList.toggle('active', b.id === 'nb-posted')
  );
  render();
  toast('Copied & marked as posted ✓');
}

async function deletePost(id) {
  if (!confirm('Delete this post?')) return;
  await LI.remove(id);
  state.posts = state.posts.filter(x => x.id !== id);
  editingId = null;
  render();
}

/* ═══════════════════════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════════════════════ */
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

function esc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ═══════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════ */
async function init() {
  await requireAuth();
  state.posts = await LI.list();
  render();

  // Real-time: refresh when Telegram agent adds a draft
  LI.subscribe(async () => {
    state.posts = await LI.list();
    render();
  });
}

init();
</script>
</body>
</html>
