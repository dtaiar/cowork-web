<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CoWork">
  <title>CoWork</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <style>
    /* ═══════════════════════════════════════
       TOKENS
    ═══════════════════════════════════════ */
    :root {
      --bg:    #090909;
      --s1:    #131313;   /* card */
      --s2:    #1b1b1b;   /* input / inner */
      --s3:    #222;      /* hover */
      --b0:    rgba(255,255,255,0.05);
      --b1:    rgba(255,255,255,0.08);
      --b2:    rgba(255,255,255,0.13);

      --t1: #efefef;
      --t2: #888;
      --t3: #444;

      /* Accent gradient */
      --ga: linear-gradient(135deg,#4A8EF7 0%,#9B7DF7 100%);
      --a1: #4A8EF7;   /* blue  */
      --a2: #9B7DF7;   /* violet */

      /* Semantic */
      --green:  #3DC87A; --green-d:  rgba(61,200,122,.13);
      --amber:  #F0A928; --amber-d:  rgba(240,169,40,.13);
      --red:    #E05555; --red-d:    rgba(224,85,85,.13);
      --blue:   #4A8EF7; --blue-d:   rgba(74,142,247,.13);
      --violet: #9B7DF7; --violet-d: rgba(155,125,247,.13);
      --teal:   #3CBFB8; --teal-d:   rgba(60,191,184,.13);

      --r:  14px;
      --rl: 18px;
      --rs: 10px;

      --safe-t: env(safe-area-inset-top,  0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --nav-h: 62px;
    }

    /* ═══════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════ */
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--t1);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      max-width: 430px;
      margin: 0 auto;
    }

    /* ═══════════════════════════════════════
       HEADER
    ═══════════════════════════════════════ */
    .safe-top { height: var(--safe-t); background: var(--bg); flex-shrink: 0; }

    header {
      flex-shrink: 0;
      padding: 16px 22px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hd-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      width: 32px; height: 32px;
      background: var(--s1);
      border: 1px solid var(--b1);
      border-radius: 10px;
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none; color: var(--t2);
      flex-shrink: 0; transition: all 0.15s;
    }
    .back-btn:active { background: var(--s2); }
    .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    .wordmark {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.6px;
      background: var(--ga);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hd-right { text-align: right; }

    .hd-date {
      font-size: 13px;
      font-weight: 500;
      color: var(--t2);
      letter-spacing: -0.1px;
    }

    .hd-sub {
      font-size: 11px;
      color: var(--t3);
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
    }

    .pending-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--amber);
      flex-shrink: 0;
    }

    /* ═══════════════════════════════════════
       SCROLL BODY
    ═══════════════════════════════════════ */
    .scroll-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 4px 20px calc(var(--nav-h) + var(--safe-b) + 28px);
    }
    .scroll-body::-webkit-scrollbar { display: none; }

    .tab-pane {
      animation: fadeUp 0.22s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ═══════════════════════════════════════
       BOTTOM NAV
    ═══════════════════════════════════════ */
    .nav-wrap {
      position: fixed;
      bottom: 0;
      left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      z-index: 100;
      padding: 8px 16px max(calc(var(--safe-b) + 12px), 28px);
      background: var(--bg);
    }

    .nav-bar {
      background: rgba(16,16,16,0.86);
      backdrop-filter: blur(28px) saturate(1.6);
      -webkit-backdrop-filter: blur(28px) saturate(1.6);
      border: 1px solid var(--b2);
      border-radius: 22px;
      display: flex;
      align-items: stretch;
      padding: 6px;
      height: var(--nav-h);
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: none;
      background: none;
      cursor: pointer;
      font-family: inherit;
      border-radius: 16px;
      padding: 4px 2px;
      transition: background 0.18s;
      position: relative;
    }

    .nav-btn:active { background: var(--s2); }

    .nav-btn .ni {  /* icon wrapper */
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 9px;
      transition: background 0.18s;
    }

    .nav-btn svg {
      width: 20px; height: 20px;
      stroke: var(--t3);
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.18s;
    }

    .nav-btn .nl { /* label */
      font-size: 10px;
      font-weight: 500;
      color: var(--t3);
      letter-spacing: 0.1px;
      transition: color 0.18s;
    }

    .nav-btn.active .ni {
      background: rgba(74,142,247,0.15);
    }
    .nav-btn.active svg { stroke: var(--a1); }
    .nav-btn.active .nl { color: var(--a1); }

    /* nav badge */
    .n-badge {
      position: absolute; top: 2px; right: 12px;
      background: var(--red);
      color: #fff; font-size: 9px; font-weight: 700;
      min-width: 15px; height: 15px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 3px;
      border: 1.5px solid var(--bg);
    }

    /* ═══════════════════════════════════════
       SECTION HEADER
    ═══════════════════════════════════════ */
    .sec {
      display: flex; align-items: center;
      justify-content: space-between;
      margin: 22px 0 10px;
    }
    .sec:first-child { margin-top: 6px; }

    .sec-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--t3);
    }

    .sec-count {
      font-size: 11px; font-weight: 500;
      color: var(--t3);
      background: var(--s2);
      padding: 2px 9px;
      border-radius: 10px;
    }

    /* ═══════════════════════════════════════
       CARD
    ═══════════════════════════════════════ */
    .card {
      background: var(--s1);
      border: 1px solid var(--b1);
      border-radius: var(--r);
      padding: 14px 15px;
      margin-bottom: 8px;
    }

    .card-urgent {
      border-color: rgba(224,85,85,.28);
      box-shadow: 0 0 0 1px rgba(224,85,85,.08);
    }

    .card-priority {
      border-left: 2px solid var(--amber);
    }

    /* ═══════════════════════════════════════
       META ROW & BADGES
    ═══════════════════════════════════════ */
    .meta {
      display: flex; align-items: center;
      gap: 6px; flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-flex; align-items: center;
      font-size: 11px; font-weight: 600;
      padding: 3px 8px; border-radius: 6px;
      letter-spacing: 0.1px;
    }

    .b-ht,
    .b-hedging,
    .b-hedging-tool   { background: var(--blue-d);   color: var(--blue);  }
    .b-portal,
    .b-customer-portal{ background: var(--green-d);  color: var(--green); }
    .b-design         { background: var(--violet-d); color: var(--violet);}
    .b-other          { background: var(--amber-d);  color: var(--amber); }
    .b-high    { background: var(--red-d);    color: var(--red);   }
    .b-medium  { background: var(--amber-d);  color: var(--amber); }
    .b-low     { background: var(--green-d);  color: var(--green); }
    .b-blocker { background: var(--red-d);    color: var(--red);   }
    .b-urgent  { background: var(--red-d);    color: var(--red); font-weight:700; }

    .ts { font-size: 11px; color: var(--t3); margin-left: auto; }

    .body-t { font-size: 14px; line-height: 1.5; color: var(--t1); }
    .sub-t  { font-size: 12px; line-height: 1.45; color: var(--t2); margin-top: 5px; }
    .info-row {
      display: flex; gap: 14px; margin-top: 8px;
      font-size: 12px; color: var(--t3);
    }

    /* ═══════════════════════════════════════
       FILTER BAR
    ═══════════════════════════════════════ */
    .filter-bar {
      display: flex; gap: 6px;
      overflow-x: auto; margin-bottom: 14px;
      padding-bottom: 2px; scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .fp {
      padding: 6px 14px; border-radius: 20px;
      border: 1px solid var(--b1);
      background: var(--s1); color: var(--t2);
      font-size: 13px; font-weight: 500;
      cursor: pointer; font-family: inherit;
      white-space: nowrap; flex-shrink: 0;
      transition: all 0.15s;
    }
    .fp.on {
      border-color: var(--a1);
      background: var(--blue-d);
      color: var(--a1);
    }

    /* ═══════════════════════════════════════
       FORM — CHIP GROUPS
    ═══════════════════════════════════════ */
    .field-label {
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.7px;
      color: var(--t3); margin-bottom: 10px;
    }

    .chip-group {
      display: flex; flex-wrap: wrap;
      gap: 7px; margin-bottom: 18px;
    }

    .chip {
      padding: 9px 18px; border-radius: 22px;
      border: 1px solid var(--b1);
      background: var(--s2); color: var(--t2);
      font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
      font-family: inherit; white-space: nowrap;
    }
    .chip:active { transform: scale(0.95); }
    .chip.on {
      border-color: var(--_c, var(--a1));
      background: var(--_cd, var(--blue-d));
      color: var(--_c, var(--a1));
    }

    /* per-chip accent overrides */
    .c-ht,
    .c-hedging-tool    { --_c: var(--blue);   --_cd: var(--blue-d);   }
    .c-portal,
    .c-customer-portal { --_c: var(--green);  --_cd: var(--green-d);  }
    .c-design          { --_c: var(--violet); --_cd: var(--violet-d); }
    .c-other           { --_c: var(--amber);  --_cd: var(--amber-d);  }
    .c-idea            { --_c: var(--blue);   --_cd: var(--blue-d);   }
    .c-question        { --_c: var(--amber);  --_cd: var(--amber-d);  }
    .c-link            { --_c: var(--violet); --_cd: var(--violet-d); }
    .c-obs             { --_c: var(--green);  --_cd: var(--green-d);  }

    /* ═══════════════════════════════════════
       TEXTAREA
    ═══════════════════════════════════════ */
    textarea {
      width: 100%; min-height: 100px;
      background: var(--s2);
      border: 1px solid var(--b1);
      border-radius: var(--rs);
      color: var(--t1); font-family: inherit;
      font-size: 15px; line-height: 1.55;
      padding: 14px; resize: none; outline: none;
      transition: border-color 0.15s;
      margin-bottom: 14px;
    }
    textarea:focus { border-color: rgba(74,142,247,.45); }
    textarea::placeholder { color: var(--t3); }

    /* ═══════════════════════════════════════
       BUTTONS
    ═══════════════════════════════════════ */
    .btn {
      display: inline-flex; align-items: center;
      justify-content: center; gap: 7px;
      padding: 14px 20px; border-radius: var(--rs);
      border: none; font-family: inherit;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
      letter-spacing: -0.1px;
    }
    .btn:active { transform: scale(0.97); opacity: 0.88; }
    .btn:disabled { opacity: 0.3; pointer-events: none; }

    .btn-primary {
      background: var(--ga); color: #fff; width: 100%;
      box-shadow: 0 4px 18px rgba(74,142,247,.22);
    }

    .btn-secondary {
      background: var(--s2); color: var(--t1);
      border: 1px solid var(--b1);
    }

    .btn-danger  { background: var(--red-d);   color: var(--red);   }
    .btn-success { background: var(--green-d);  color: var(--green); }

    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1; }
    .btn-stack { display: flex; flex-direction: column; gap: 8px; }

    /* ═══════════════════════════════════════
       TASK ITEM
    ═══════════════════════════════════════ */
    .task-item {
      background: var(--s1);
      border: 1px solid var(--b1);
      border-radius: var(--r);
      padding: 13px 14px; margin-bottom: 7px;
      display: flex; align-items: flex-start; gap: 12px;
      transition: border-color 0.15s;
    }
    .task-item.t-priority { border-left: 2px solid var(--amber); }
    .task-item.t-done     { opacity: 0.35; }
    .task-item.t-done .task-title { text-decoration: line-through; }

    .task-check {
      width: 22px; height: 22px; min-width: 22px;
      border: 1.5px solid var(--b2); border-radius: 7px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      margin-top: 1px; transition: all 0.15s;
      background: var(--s2); flex-shrink: 0;
    }
    .task-check:active { transform: scale(0.88); }
    .task-check.checked { background: var(--green); border-color: var(--green); }
    .task-check.checked::after {
      content: '';
      width: 5px; height: 9px;
      border: solid #fff; border-width: 0 2px 2px 0;
      transform: rotate(45deg); margin-bottom: 2px;
    }

    .task-body { flex: 1; min-width: 0; }
    .task-title { font-size: 14px; line-height: 1.4; font-weight: 500; color: var(--t1); }
    .task-note  { font-size: 12px; color: var(--t2); margin-top: 4px; line-height: 1.4; }
    .task-notes {
      font-size: 12px; color: var(--t2); margin-top: 5px; line-height: 1.5;
      white-space: pre-wrap; border-left: 2px solid rgba(155,125,247,.3);
      padding-left: 8px;
    }

    .task-foot {
      display: flex; align-items: center;
      gap: 6px; margin-top: 8px;
    }

    .pri-tag {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--amber); background: var(--amber-d);
      padding: 2px 7px; border-radius: 5px;
    }

    /* ═══════════════════════════════════════
       CAPTURE ITEM
    ═══════════════════════════════════════ */
    .cap-item {
      background: var(--s1); border: 1px solid var(--b1);
      border-radius: var(--r);
      padding: 13px 14px; margin-bottom: 8px;
    }
    .cap-item.synced { opacity: 0.3; }

    .cap-actions { display: flex; gap: 7px; margin-top: 10px; }
    .cap-actions .btn { padding: 7px 13px; font-size: 12px; border-radius: 8px; flex: 1; }

    .cap-enrichment {
      margin-top: 10px;
      padding: 10px 12px;
      background: rgba(155,125,247,.07);
      border-left: 2px solid var(--violet);
      border-radius: 0 8px 8px 0;
      font-size: 13px;
      line-height: 1.55;
      color: var(--t2);
    }

    .enrich-pending {
      font-size: 11px;
      color: var(--violet);
      opacity: 0.5;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50%       { opacity: 0.8; }
    }

    /* ═══════════════════════════════════════
       SUB TABS (Intel)
    ═══════════════════════════════════════ */
    .sub-tabs {
      display: flex; overflow-x: auto; gap: 6px;
      margin-bottom: 16px; padding-bottom: 2px;
      scrollbar-width: none;
    }
    .sub-tabs::-webkit-scrollbar { display: none; }

    .sub-tab {
      padding: 7px 16px; border-radius: 20px;
      border: 1px solid var(--b1);
      background: var(--s1); color: var(--t2);
      font-size: 13px; font-weight: 500;
      cursor: pointer; font-family: inherit;
      white-space: nowrap; flex-shrink: 0;
      transition: all 0.15s;
    }
    .sub-tab.on {
      background: var(--blue-d); border-color: var(--a1); color: var(--a1);
    }

    /* ═══════════════════════════════════════
       SYNC / EXPORT BLOCKS
    ═══════════════════════════════════════ */
    .sync-block {
      background: var(--s1); border: 1px solid var(--b1);
      border-radius: var(--rl); padding: 18px; margin-bottom: 12px;
    }
    .sync-block-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .sync-block-sub   { font-size: 13px; color: var(--t2); line-height: 1.5; margin-bottom: 14px; }

    .code-preview {
      background: var(--s2); border-radius: 8px; padding: 12px;
      font-size: 11px; font-family: "SF Mono", ui-monospace, monospace;
      white-space: pre-wrap; word-break: break-word;
      color: var(--t2); max-height: 160px; overflow-y: auto;
      line-height: 1.5; margin-bottom: 12px;
    }

    #importArea {
      width: 100%; min-height: 90px;
      background: var(--s2); border: 1px solid var(--b1);
      border-radius: var(--rs); color: var(--t1);
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 11px; padding: 12px; resize: none;
      outline: none; line-height: 1.5; margin-bottom: 10px;
    }
    #importArea:focus { border-color: rgba(74,142,247,.45); }

    /* ═══════════════════════════════════════
       MISC
    ═══════════════════════════════════════ */
    .hint {
      font-size: 12px; color: var(--t3); text-align: center;
      line-height: 1.5; padding: 0 10px; margin-top: 8px;
    }

    code {
      background: var(--s2); padding: 2px 6px; border-radius: 4px;
      font-size: 11px; font-family: "SF Mono", ui-monospace, monospace;
      color: var(--t2);
    }

    .empty {
      text-align: center; padding: 60px 20px 40px; color: var(--t3);
    }
    .empty-icon { font-size: 38px; margin-bottom: 12px; opacity: 0.5; }
    .empty-text { font-size: 14px; line-height: 1.6; }

    /* ═══════════════════════════════════════
       TOAST
    ═══════════════════════════════════════ */
    .toast {
      position: fixed;
      bottom: calc(var(--nav-h) + var(--safe-b) + 20px);
      left: 50%; transform: translateX(-50%) translateY(70px);
      background: rgba(240,240,240,0.94);
      color: #111; padding: 10px 22px;
      border-radius: 22px; font-size: 14px; font-weight: 500;
      z-index: 200;
      transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
      white-space: nowrap;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ═══════════════════════════════════════
       GRADIENT DIVIDER
    ═══════════════════════════════════════ */
    .gdiv {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--b2) 50%, transparent);
      margin: 4px 0 18px;
    }
  </style>
</head>
<body>

<div class="safe-top"></div>

<header>
  <div class="hd-left">
    <a class="back-btn" href="index.html">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="wordmark">Capture</div>
  </div>
  <div class="hd-right">
    <div class="hd-date" id="hdDate"></div>
    <div class="hd-sub" id="hdSub">
      <span class="pending-dot" id="pendingDot" style="display:none"></span>
      <span id="hdSubText"></span>
    </div>
  </div>
</header>

<div class="scroll-body" id="scrollBody">
  <div class="tab-pane" id="tabPane"></div>
</div>

<!-- NAV -->
<div class="nav-wrap">
  <div class="nav-bar">

    <button class="nav-btn active" id="nb-capture" onclick="goto('capture')">
      <div class="ni">
        <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </div>
      <span class="nl">Capture</span>
      <span class="n-badge" id="capBadge" style="display:none"></span>
    </button>

    <button class="nav-btn" id="nb-tasks" onclick="goto('tasks')">
      <div class="ni">
        <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </div>
      <span class="nl">Tasks</span>
    </button>

    <button class="nav-btn" id="nb-intel" onclick="goto('intel')">
      <div class="ni">
        <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </div>
      <span class="nl">Intel</span>
    </button>


<button class="nav-btn" id="nb-linkedin" onclick="goto('linkedin')">
      <div class="ni">
        <svg viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
      </div>
      <span class="nl">LinkedIn</span>
    </button>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   STATE  (populated from Supabase on init)
═══════════════════════════════════════════════════════════════ */
let state = {
  captures:  [],
  tasks:     [],
  blockers:  [],
  questions: [],
  decisions: [],
  actions:   [],
  liPosts:   []
};

/* ═══════════════════════════════════════════════════════════════
   NAV STATE
═══════════════════════════════════════════════════════════════ */
let tab       = 'capture';
let selProj   = 'customer-portal';
let selType   = 'idea';
let capFilt   = 'all';
let taskFilt  = 'all';
let intelTab  = 'blockers';
let intelFilt = 'all';
let intelProj = 'hedging-tool';

const PROJ  = {
  'hedging':        'Hedging',
  'hedging-tool':   'Hedging',
  'portal':         'Portal',
  'customer-portal':'Portal',
  'design':         'Design',
  'other':          'Other'
};
const TYPES = { idea:'💡 Idea', question:'❓ Question', link:'🔗 Link', obs:'👁 Observation' };
const TICON = { idea:'💡', question:'❓', link:'🔗', obs:'👁' };

const GLOSSARY_DATA = [
  {term:'HT',           meaning:'Hedging Tool — the main trading/hedging platform.',                     cat:'AXPO Terms'},
  {term:'DMA',          meaning:'Direct Market Access — trading directly on exchange.',                   cat:'AXPO Terms'},
  {term:'TGE',          meaning:'Towarowa Giełda Energii — Polish energy exchange. Gas pilot uses TGE.', cat:'AXPO Terms'},
  {term:'Mingle',       meaning:"AXPO's internal Confluence instance for specs and documentation.",       cat:'AXPO Terms'},
  {term:'RFQ',          meaning:'Request For Quote — client requests a price from a trader.',             cat:'AXPO Terms'},
  {term:'EMIS',         meaning:'Energy Management Information System — nominated volumes integration.',  cat:'AXPO Terms'},
  {term:'CMACH',        meaning:'C-MACH+ — Customer Portal feature for 15-min production data.',         cat:'AXPO Terms'},
  {term:'Intraday',     meaning:'Same-day energy trading. Intraday RFQ is a key Portal feature.',        cat:'AXPO Terms'},
  {term:'One Market',   meaning:'Cross-market product; controlled release targeting Switzerland.',        cat:'AXPO Terms'},
  {term:'DNA',          meaning:'Internal platform; migration caused lost-quotes risk for Intraday RFQ.',cat:'AXPO Terms'},
  {term:'Tranche',      meaning:'Polish comms word for hedge (use "Hedge" for EU, "Tranche" for Poland).', cat:'AXPO Terms'},
  {term:'!!!',          meaning:'High priority item.',                                                    cat:'Notation'},
  {term:'#🧑‍💻Pending',  meaning:'Blocked — waiting on info from PM or stakeholder.',                    cat:'Notation'},
  {term:'UX',           meaning:'User Experience.',                                                       cat:'Notation'},
  {term:'PRD',          meaning:'Product Requirements Document.',                                         cat:'Notation'},
  {term:'DS',           meaning:'Design System.',                                                         cat:'Notation'},
  {term:'TBC',          meaning:'To be confirmed.',                                                       cat:'Notation'},
];

/* ═══════════════════════════════════════════════════════════════
   NAV
═══════════════════════════════════════════════════════════════ */
function goto(t) {
  tab = t;
  document.querySelectorAll('.nav-btn').forEach(b =>
    b.classList.toggle('active', b.id === 'nb-' + t)
  );
  render();
  document.getElementById('scrollBody').scrollTop = 0;
}

/* ═══════════════════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════════════════ */
function refreshHeader() {
  const now = new Date();
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('hdDate').textContent =
    `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;

  const count = state.captures.length;
  const sub   = document.getElementById('hdSubText');
  const badge = document.getElementById('capBadge');
  const dot   = document.getElementById('pendingDot');

  if (count > 0) {
    dot.style.display = 'block';
    sub.textContent   = `${count} capture${count !== 1 ? 's' : ''}`;
    badge.style.display = 'flex';
    badge.textContent   = count;
  } else {
    dot.style.display   = 'none';
    sub.textContent     = 'No captures yet';
    badge.style.display = 'none';
  }
}

/* ═══════════════════════════════════════════════════════════════
   RENDER ROUTER
═══════════════════════════════════════════════════════════════ */
function render() {
  const pane = document.getElementById('tabPane');
  pane.className = 'tab-pane';
  void pane.offsetWidth;
  pane.className = 'tab-pane';

  if (tab === 'capture')  pane.innerHTML = renderCapture();
  if (tab === 'tasks')    pane.innerHTML = renderTasks();
  if (tab === 'intel')    pane.innerHTML = renderIntel();
  if (tab === 'linkedin') pane.innerHTML = renderLinkedin();

  refreshHeader();
}

/* ═══════════════════════════════════════════════════════════════
   CAPTURE TAB
═══════════════════════════════════════════════════════════════ */
function renderCapture() {
  const caps = state.captures.filter(c => capFilt === 'all' || c.project === capFilt);

  const form = `
    <div class="card" style="margin-bottom:20px">
      <div class="field-label">Project</div>
      <div class="chip-group">
        ${[['hedging-tool','Hedging'],['customer-portal','Portal'],['design','Design'],['other','Other']].map(([k,v]) =>
          `<button class="chip c-${k} ${selProj===k?'on':''}" onclick="sp('${k}')">${v}</button>`
        ).join('')}
      </div>
      <div class="field-label">Type</div>
      <div class="chip-group">
        ${Object.entries(TYPES).map(([k,v]) =>
          `<button class="chip c-${k} ${selType===k?'on':''}" onclick="st('${k}')">${v}</button>`
        ).join('')}
      </div>
      <div class="field-label">Content</div>
      <textarea id="ct" placeholder="What's on your mind?"></textarea>
      <button class="btn btn-primary" onclick="addCap()">Save capture</button>
    </div>`;

  const fbar = `<div class="filter-bar">
    ${[['all','All'],['hedging-tool','Hedging'],['customer-portal','Portal'],['design','Design'],['other','Other']].map(([f,l]) =>
      `<button class="fp ${capFilt===f?'on':''}" onclick="setCF('${f}')">${l}</button>`
    ).join('')}
  </div>`;

  const capCard = c => `
    <div class="cap-item">
      <div class="meta">
        <span class="badge b-${c.project}">${PROJ[c.project] || c.project}</span>
        <span style="font-size:13px">${TICON[c.type] || '📝'}</span>
        <span class="ts">${fmtRel(c.created_at)}</span>
        ${!c.enriched ? '<span class="enrich-pending" title="Enriching…">✦</span>' : ''}
      </div>
      <div class="body-t">${esc(c.content)}</div>
      ${c.enrichment ? `<div class="cap-enrichment">${esc(c.enrichment)}</div>` : ''}
      <div class="cap-actions">
        <button class="btn btn-danger" onclick="delCap('${c.id}')">Delete</button>
      </div>
    </div>`;

  if (!state.captures.length) return form;

  let list = fbar;
  if (caps.length) {
    list += `<div class="sec">
      <span class="sec-label">Captures</span>
      <span class="sec-count">${caps.length}</span>
    </div>`;
    list += caps.map(capCard).join('');
  } else {
    list += empty('📭', 'No captures for this project');
  }

  return form + list;
}

/* ═══════════════════════════════════════════════════════════════
   TASKS TAB
═══════════════════════════════════════════════════════════════ */
function renderTasks() {
  const all  = state.tasks;
  const filt = taskFilt === 'all' ? all : all.filter(t => t.project === taskFilt);

  const fbar = `<div class="filter-bar">
    ${[['all','All'],['hedging-tool','Hedging'],['customer-portal','Portal'],['design','Design'],['other','Other']].map(([f,l]) =>
      `<button class="fp ${taskFilt===f?'on':''}" onclick="setTF('${f}')">${l}</button>`
    ).join('')}
  </div>`;

  const SECS = [
    {key:'active',  label:'Active'},
    {key:'waiting', label:'Waiting on'},
    {key:'someday', label:'Someday'},
    {key:'done',    label:'Done'},
  ];

  const taskRow = t => `
    <div class="task-item ${t.priority?'t-priority':''} ${t.done?'t-done':''}">
      <div class="task-check ${t.done?'checked':''}" onclick="toggleTask('${t.id}')"></div>
      <div class="task-body">
        <div class="task-title">${esc(t.title)}</div>
        ${t.notes ? `<div class="task-notes">${esc(t.notes)}</div>` : ''}
        <div class="task-foot">
          <span class="badge b-${t.project}">${PROJ[t.project] || t.project || ''}</span>
          ${t.priority ? `<span class="pri-tag">PRIORITY</span>` : ''}
          ${t.notes ? `<span class="pri-tag" style="background:rgba(155,125,247,.15);color:#9B7DF7;">✦ enriched</span>` : ''}
        </div>
      </div>
    </div>`;

  let html = fbar;
  let any  = false;

  SECS.forEach(s => {
    const items = filt.filter(t => t.section === s.key);
    if (!items.length) return;
    any = true;
    html += `<div class="sec"><span class="sec-label">${s.label}</span><span class="sec-count">${items.length}</span></div>`;
    html += items.map(taskRow).join('');
  });

  if (!any) html += empty('📭', 'No tasks here');
  return html;
}

/* ═══════════════════════════════════════════════════════════════
   INTEL TAB
═══════════════════════════════════════════════════════════════ */
function renderIntel() {
  const STABS = {blockers:'⚠️ Blockers', questions:'❓ Questions', decisions:'✅ Decisions', actions:'📋 Actions', glossary:'📖 Glossary'};

  const nav = `<div class="sub-tabs">
    ${Object.entries(STABS).map(([k,v]) =>
      `<button class="sub-tab ${intelTab===k?'on':''}" onclick="setIT('${k}')">${v}</button>`
    ).join('')}
  </div>`;

  const fbar = `<div class="filter-bar">
    ${[['all','All'],['hedging-tool','Hedging'],['customer-portal','Portal']].map(([f,l]) =>
      `<button class="fp ${intelFilt===f?'on':''}" onclick="setIF('${f}')">${l}</button>`
    ).join('')}
  </div>`;

  const intelForm = (type) => `
    <div class="card" style="margin-bottom:16px">
      <div class="field-label">Project</div>
      <div class="chip-group" style="margin-bottom:12px">
        ${[['hedging-tool','Hedging'],['customer-portal','Portal']].map(([k,v]) =>
          `<button class="chip c-${k} ${intelProj===k?'on':''}" onclick="setIP('${k}')">${v}</button>`
        ).join('')}
      </div>
      <textarea id="intelTxt" placeholder="${type==='blocker'?'What\'s blocking you?':'What do you need answered?'}" style="min-height:70px"></textarea>
      <div class="btn-row">
        <button class="btn btn-primary" style="font-size:13px;padding:10px 14px" onclick="addIntel('${type}')">Log ${type}</button>
      </div>
    </div>`;

  let body = nav + (intelTab !== 'glossary' ? fbar : '');
  if (intelTab === 'blockers' || intelTab === 'questions') {
    body += intelForm(intelTab === 'blockers' ? 'blocker' : 'question');
  }

  // Helper: intel content field supports both plain strings (from Telegram) and legacy JSON objects
  function intelText(row, ...fields) {
    const raw = row.content;
    if (!raw) return '';
    if (typeof raw === 'string') return raw;
    const obj = (typeof raw === 'object') ? raw : {};
    for (const f of fields) { if (obj[f]) return obj[f]; }
    return '';
  }
  function intelObj(row) {
    const raw = row.content;
    if (!raw || typeof raw === 'string') return {};
    return typeof raw === 'object' ? raw : {};
  }

  if (intelTab === 'blockers') {
    const items = state.blockers.filter(b => intelFilt==='all' || b.project===intelFilt);
    if (!items.length) return body + empty('🎉','No blockers in scope');
    items.forEach(b => {
      const c = intelObj(b);
      const text = intelText(b, 'description', 'text');
      body += `<div class="card ${b.urgent?'card-urgent':''}">
        <div class="meta">
          <span class="badge b-${b.project}">${PROJ[b.project]||b.project||''}</span>
          ${b.urgent ? `<span class="badge b-urgent">URGENT</span>` : ''}
          <span class="ts">${fmtRel(b.created_at)}</span>
        </div>
        <div class="body-t">${esc(text)}</div>
        ${c.impact ? `<div class="sub-t">${esc(c.impact)}</div>` : ''}
        <div class="info-row">
          ${c.owner ? `<span>👤 ${esc(c.owner)}</span>` : ''}
          ${c.due   ? `<span>📅 ${esc(c.due)}</span>`   : ''}
        </div>
      </div>`;
    });
  }

  if (intelTab === 'questions') {
    const items = state.questions.filter(q => intelFilt==='all' || q.project===intelFilt);
    if (!items.length) return body + empty('🎉','No open questions');
    items.forEach(q => {
      const c = intelObj(q);
      const text = intelText(q, 'text', 'question');
      body += `<div class="card">
        <div class="meta">
          <span class="badge b-${q.project}">${PROJ[q.project]||q.project||''}</span>
          ${c.priority ? `<span class="badge b-${c.priority}">${c.priority}</span>` : ''}
          ${c.blocker  ? `<span class="badge b-blocker">Blocker</span>` : ''}
          <span class="ts">${fmtRel(q.created_at)}</span>
        </div>
        <div class="body-t">${esc(text)}</div>
        ${c.context ? `<div class="sub-t">${esc(c.context)}</div>` : ''}
      </div>`;
    });
  }

  if (intelTab === 'decisions') {
    const items = state.decisions.filter(d => intelFilt==='all' || d.project===intelFilt || (Array.isArray(intelObj(d).domains) && intelObj(d).domains.includes(intelFilt)));
    if (!items.length) return body + empty('📋','No decisions logged');
    items.forEach(d => {
      const c = intelObj(d);
      const text = intelText(d, 'text', 'decision');
      body += `<div class="card">
        <div class="meta">
          <span class="badge b-${d.project}">${PROJ[d.project]||d.project||''}</span>
          <span class="ts">${fmtDate(d.created_at)}</span>
        </div>
        <div class="body-t">${esc(text)}</div>
        ${c.approved_by ? `<div class="sub-t">↳ ${esc(c.approved_by)}</div>` : ''}
      </div>`;
    });
  }

  if (intelTab === 'actions') {
    const open = state.actions.filter(a => !intelObj(a).done);
    const done = state.actions.filter(a =>  intelObj(a).done);
    if (!state.actions.length) return body + empty('✅','No action items');

    if (open.length) {
      body += `<div class="sec"><span class="sec-label">Open</span><span class="sec-count">${open.length}</span></div>`;
      open.forEach(a => {
        const c = intelObj(a);
        const text = intelText(a, 'text', 'action');
        body += `<div class="card ${a.urgent?'card-urgent':''}">
          <div class="meta">
            ${a.urgent ? `<span class="badge b-urgent">URGENT</span>` : ''}
            ${c.due ? `<span class="ts">${esc(c.due)}</span>` : ''}
          </div>
          <div class="body-t">${esc(text)}</div>
          ${c.owner ? `<div class="sub-t">👤 ${esc(c.owner)}</div>` : ''}
        </div>`;
      });
    }
    if (done.length) {
      body += `<div class="sec"><span class="sec-label">Done</span><span class="sec-count">${done.length}</span></div>`;
      done.forEach(a => {
        const text = intelText(a, 'text', 'action');
        body += `<div class="card" style="opacity:.35"><div class="body-t" style="text-decoration:line-through">${esc(text)}</div></div>`;
      });
    }
  }

  if (intelTab === 'glossary') {
    const q = (document.getElementById('glossaryQ')?.value || '').toLowerCase();
    const items = GLOSSARY_DATA.filter(g =>
      !q || g.term.toLowerCase().includes(q) || g.meaning.toLowerCase().includes(q)
    );
    body += `<div style="margin-bottom:14px;">
      <input id="glossaryQ" type="search"
        style="width:100%;background:var(--s2);border:1px solid var(--b1);border-radius:var(--rs);color:var(--t1);font-family:inherit;font-size:14px;padding:10px 14px;outline:none;"
        placeholder="Search terms…" oninput="setIT('glossary')" value="${esc(q)}">
    </div>`;
    if (!items.length) {
      body += empty('🔍', 'No matching terms');
    } else {
      const cats = [...new Set(items.map(g => g.cat))];
      cats.forEach(cat => {
        body += `<div class="sec" style="margin-top:12px;"><span class="sec-label">${esc(cat)}</span></div>`;
        items.filter(g => g.cat === cat).forEach(g => {
          body += `<div class="card" style="padding:11px 13px;margin-bottom:6px;">
            <div style="display:flex;gap:10px;align-items:baseline;">
              <code style="font-size:12px;color:var(--amber);background:var(--amber-d);padding:2px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;">${esc(g.term)}</code>
              <span style="font-size:13px;color:var(--t2);line-height:1.45;">${esc(g.meaning)}</span>
            </div>
          </div>`;
        });
      });
    }
  }

  return body;
}

/* ═══════════════════════════════════════════════════════════════
   LINKEDIN TAB
═══════════════════════════════════════════════════════════════ */
// Must match linkedin.html TOPICS keys exactly
const LI_TOPICS = {
  design:    { label:'Design',      color:'#4A8EF7' },
  product:   { label:'Product',     color:'#F0A928' },
  tools:     { label:'Tools',       color:'#3CBFB8' },
  personal:  { label:'Personal',    color:'#3DC87A' },
  casestudy: { label:'Case Study',  color:'#9B7DF7' },
};

let liSelTopic = 'design';
function liPick(t) { liSelTopic = t; render(); }

function renderLinkedin() {
  const posts = state.liPosts;

  const topicBtns = Object.entries(LI_TOPICS).map(([k, v]) => `
    <button onclick="liPick('${k}')" style="
      flex:1;border:1px solid ${liSelTopic===k ? v.color : 'rgba(255,255,255,0.08)'};
      background:${liSelTopic===k ? v.color+'22' : 'var(--s1)'};
      border-radius:10px;padding:10px 6px;cursor:pointer;text-align:left;position:relative;overflow:hidden;">
      <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${v.color};border-radius:3px 0 0 3px;"></div>
      <div style="font-size:12px;font-weight:500;color:${liSelTopic===k ? '#fff' : 'rgba(255,255,255,0.55)'};line-height:1.3;padding-left:8px;">${v.label}</div>
    </button>`).join('');

  const captureForm = `
    <div class="card" style="margin-bottom:20px">
      <div class="field-label">Topic</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:14px;">${topicBtns}</div>
      <div class="field-label">Idea</div>
      <textarea id="liTxt" placeholder="Post angle, observation, hook…" style="min-height:80px"></textarea>
      <button class="btn btn-primary" onclick="liSaveIdea()">Save idea</button>
    </div>`;

  const STATUS_STYLE = {
    idea:     { bg:'rgba(255,255,255,0.06)', color:'var(--t2)',    label:'idea' },
    drafting: { bg:'rgba(155,125,247,.15)',  color:'#9B7DF7',      label:'✦ drafting' },
    ready:    { bg:'rgba(61,200,122,.15)',   color:'#3DC87A',      label:'ready' },
    posted:   { bg:'rgba(255,255,255,0.04)', color:'var(--t3)',    label:'posted' },
  };

  const postRow = p => {
    const topic = LI_TOPICS[p.topic] || { label: p.topic || 'Post', color:'#888' };
    const st = STATUS_STYLE[p.status] || STATUS_STYLE.idea;
    const preview = p.hook || p.content || 'Untitled';
    return `
      <div style="background:var(--s1);border:1px solid ${p.status==='drafting'?'rgba(155,125,247,.2)':'rgba(255,255,255,0.06)'};border-radius:10px;
                  padding:10px 12px 10px 14px;display:flex;align-items:center;gap:10px;
                  position:relative;overflow:hidden;margin-bottom:8px;">
        <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${topic.color};border-radius:3px 0 0 3px;"></div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:500;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(preview)}</div>
          <div style="display:flex;gap:6px;margin-top:3px;align-items:center;">
            <span style="font-size:10px;padding:1px 6px;border-radius:99px;font-weight:500;background:${topic.color}22;color:${topic.color};">${topic.label}</span>
            <span style="font-size:10px;padding:1px 6px;border-radius:99px;font-weight:500;background:${st.bg};color:${st.color};">${st.label}</span>
            <span class="ts">${fmtRel(p.created_at)}</span>
          </div>
        </div>
      </div>`;
  };

  let html = captureForm;
  if (posts.length) {
    html += `<div class="sec"><span class="sec-label">Post ideas</span><span class="sec-count">${posts.length}</span></div>`;
    html += posts.map(postRow).join('');
  } else {
    html += empty('✍️','No post ideas yet — add one above');
  }
  return html;
}

/* ═══════════════════════════════════════════════════════════════
   CAPTURE ACTIONS
═══════════════════════════════════════════════════════════════ */
const sp    = p => { selProj = p; render(); };
const st    = t => { selType = t; render(); };
const setCF = f => { capFilt = f; render(); };

async function addCap() {
  const el = document.getElementById('ct');
  const content = el?.value?.trim();
  if (!content) { toast('Write something first'); return; }
  const cap = await Captures.add({ project: selProj, type: selType, content });
  if (cap) state.captures.unshift(cap);
  el.value = '';
  toast('Saved ✓');
  render();
  refreshHeader();
}

async function delCap(id) {
  if (!confirm('Delete?')) return;
  await Captures.remove(id);
  state.captures = state.captures.filter(c => c.id !== id);
  render();
  refreshHeader();
}

/* ═══════════════════════════════════════════════════════════════
   TASK ACTIONS
═══════════════════════════════════════════════════════════════ */
const setTF = f => { taskFilt = f; render(); };

async function toggleTask(id) {
  const t = state.tasks.find(t => t.id === id);
  if (!t) return;
  const nowDone = !t.done;
  const updated = await Tasks.update(id, {
    done: nowDone,
    section: nowDone ? 'done' : 'active'
  });
  if (updated) Object.assign(t, updated);
  render();
  toast(nowDone ? 'Done ✓' : 'Reopened');
}

/* ═══════════════════════════════════════════════════════════════
   INTEL ACTIONS
═══════════════════════════════════════════════════════════════ */
const setIT = t => { intelTab = t; intelFilt = 'all'; render(); };
const setIF = f => { intelFilt = f; render(); };
const setIP = p => { intelProj = p; render(); };

async function addIntel(type) {
  const el = document.getElementById('intelTxt');
  const content = el?.value?.trim();
  if (!content) { toast('Write something first'); return; }
  const row = await Intel.add({
    type,
    project: intelProj,
    content,
    urgent: type === 'blocker'
  });
  if (row) {
    if (type === 'blocker')  state.blockers.unshift(row);
    if (type === 'question') state.questions.unshift(row);
  }
  el.value = '';
  toast(`${type === 'blocker' ? 'Blocker' : 'Question'} logged ✓`);
  render();
}

/* ═══════════════════════════════════════════════════════════════
   LINKEDIN ACTIONS
═══════════════════════════════════════════════════════════════ */
async function liSaveIdea() {
  const txt = document.getElementById('liTxt')?.value?.trim();
  if (!txt) { toast('Write something first'); return; }
  const post = await LI.add({ topic: liSelTopic, hook: txt, content: '', status: 'idea' });
  if (post) state.liPosts.unshift(post);
  document.getElementById('liTxt').value = '';
  toast('Idea saved ✓');
  render();
}

/* ═══════════════════════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════════════════════ */
function fmtRel(iso) {
  const m = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (m < 1)  return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m/60);
  if (h < 24) return `${h}h ago`;
  const dd = Math.floor(h/24);
  if (dd === 1) return 'yesterday';
  if (dd < 7)  return `${dd}d ago`;
  return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function fmtDate(s) {
  return new Date(s).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function empty(icon, msg) {
  return `<div class="empty"><div class="empty-icon">${icon}</div><div class="empty-text">${msg}</div></div>`;
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

/* ═══════════════════════════════════════════════════════════════
   LOADING STATE
═══════════════════════════════════════════════════════════════ */
function showLoading() {
  document.getElementById('tabPane').innerHTML = `
    <div class="empty">
      <div class="empty-icon">⏳</div>
      <div class="empty-text">Loading…</div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════ */
async function init() {
  await requireAuth();
  showLoading();

  const [caps, tasks, intel, li] = await Promise.all([
    Captures.list(),
    Tasks.list(),
    Intel.list(),
    LI.list()
  ]);

  state.captures  = caps;
  state.tasks     = tasks;
  state.blockers  = intel.filter(i => i.type === 'blocker');
  state.questions = intel.filter(i => i.type === 'question');
  state.decisions = intel.filter(i => i.type === 'decision');
  state.actions   = intel.filter(i => i.type === 'action');
  state.liPosts   = li;

  render();
  refreshHeader();

  // Real-time: refresh captures when any device adds/removes one
  Captures.subscribe(async () => {
    state.captures = await Captures.list();
    if (tab === 'capture') render();
    refreshHeader();
  });

  // Real-time: refresh tasks when dashboard changes them
  Tasks.subscribe(async () => {
    state.tasks = await Tasks.list();
    if (tab === 'tasks') render();
  });

  // Real-time: refresh intel when Telegram agent adds blockers/questions
  Intel.subscribe(async () => {
    const intel = await Intel.list();
    state.blockers  = intel.filter(i => i.type === 'blocker');
    state.questions = intel.filter(i => i.type === 'question');
    state.decisions = intel.filter(i => i.type === 'decision');
    state.actions   = intel.filter(i => i.type === 'action');
    if (tab === 'intel') render();
  });

  // Real-time: refresh LinkedIn posts when Telegram agent saves a draft
  LI.subscribe(async () => {
    state.liPosts = await LI.list();
    if (tab === 'linkedin') render();
  });
}

init();
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshHeader(); });
</script>
